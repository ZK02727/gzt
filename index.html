<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人工作台</title>
<style>
/* ===== 全局重置与基础 ===== */
* { margin:0; padding:0; box-sizing:border-box; }
:root {
  --bg-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
  --glass-bg: rgba(255,255,255,0.72);
  --glass-border: rgba(255,255,255,0.6);
  --glass-shadow: 0 8px 32px rgba(31,38,135,0.12);
  --glass-radius: 20px;
  --accent: #6366f1;
  --accent-dark: #4f46e5;
  --accent-light: #e0e7ff;
  --text-primary: #1e293b;
  --text-secondary: #64748b;
  --text-muted: #94a3b8;
  --bg-page: #f0f2f5;
  --card-bg: rgba(255,255,255,0.85);
  --radius-sm: 10px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --transition: all .25s cubic-bezier(.4,0,.2,1);
}
body { font-family:"Segoe UI","微软雅黑","Microsoft YaHei",system-ui,sans-serif; font-size:14px; color:var(--text-primary); background:var(--bg-page); height:100vh; overflow:hidden; display:flex; }

/* ===== 左侧导航栏（毛玻璃） ===== */
.sidebar { width:220px; min-width:220px; background:rgba(255,255,255,0.6); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border-right:1px solid var(--glass-border); display:flex; flex-direction:column; height:100vh; z-index:10; }
.sidebar-title { padding:28px 20px 4px; font-size:22px; font-weight:800; letter-spacing:0.5px; background:linear-gradient(135deg,#6366f1,#764ba2); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text; }
.sidebar-subtitle { padding:0 20px 20px; font-size:11px; color:var(--text-muted); letter-spacing:2px; font-weight:500; }
.nav-list { flex:1; padding:0 12px; }
.nav-item { display:flex; align-items:center; padding:12px 16px; cursor:pointer; transition:var(--transition); position:relative; border-radius:var(--radius-md); margin-bottom:4px; }
.nav-item:hover { background:rgba(99,102,241,0.08); }
.nav-item.active { background:linear-gradient(135deg,#6366f1,#764ba2); color:#fff; box-shadow:0 4px 14px rgba(99,102,241,0.35); }
.nav-divider { height:1px; background:rgba(0,0,0,0.06); margin:8px 12px; }
.nav-icon { font-size:18px; margin-right:10px; width:24px; text-align:center; }
.nav-label { flex:1; font-size:14px; font-weight:500; }
.nav-badge { background:#ef4444; color:#fff; font-size:10px; border-radius:10px; padding:2px 7px; min-width:20px; text-align:center; font-weight:600; }
.nav-item.active .nav-badge { background:rgba(255,255,255,0.3); }
.sidebar-footer { padding:16px 20px; font-size:11px; color:var(--text-muted); border-top:1px solid rgba(0,0,0,0.06); }

/* ===== 右侧内容区 ===== */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--bg-page); }
.main-header { padding:14px 32px; display:flex; align-items:center; justify-content:space-between; }
.main-header h2 { font-size:24px; color:var(--text-primary); font-weight:700; }
.main-stats { display:flex; gap:16px; font-size:13px; color:var(--text-secondary); margin-top:6px; }
.main-stats span span { font-weight:700; color:var(--accent); }

/* ===== 顶部面板（日历+时钟）Bento卡片 ===== */
.top-panel { padding:0 32px 10px; }
.top-panel-inner { display:flex; gap:16px; }

/* ===== 月历 Bento卡片 ===== */
.calendar-section { flex:1; min-width:0; background:var(--glass-bg); backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px); border:1px solid var(--glass-border); border-radius:var(--radius-lg); box-shadow:var(--glass-shadow); padding:10px 16px; }
.calendar-nav { display:flex; align-items:center; gap:8px; margin-bottom:8px; }
.calendar-nav-btn { background:rgba(99,102,241,0.1); border:none; border-radius:var(--radius-sm); padding:4px 10px; cursor:pointer; font-size:12px; color:var(--accent); transition:var(--transition); }
.calendar-nav-btn:hover { background:var(--accent); color:#fff; }
.calendar-month { font-size:15px; font-weight:700; color:var(--text-primary); }
.calendar-toggle { background:none; border:none; cursor:pointer; font-size:13px; color:var(--text-muted); transition:transform .2s; padding:2px 6px; border-radius:6px; }
.calendar-toggle:hover { color:var(--accent); background:var(--accent-light); }
.calendar-toggle.collapsed { transform:rotate(-90deg); }
.calendar-legend { display:flex; gap:10px; margin-left:auto; font-size:10px; color:var(--text-muted); }
.legend-item { display:flex; align-items:center; gap:3px; }
.legend-dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
.legend-dot.dot-month { background:#8b5cf6; }
.legend-dot.dot-temp { background:#ef4444; }
.legend-dot.dot-special { background:#f59e0b; }
.calendar-body { overflow:hidden; transition:max-height .3s ease, opacity .3s ease; max-height:400px; opacity:1; }
.calendar-body.collapsed { max-height:0; opacity:0; }
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:2px; }
.cal-weekday { text-align:center; font-size:11px; color:var(--text-muted); padding:2px 0; font-weight:600; }
.cal-day { text-align:center; padding:4px 0; border-radius:8px; font-size:12px; cursor:pointer; position:relative; transition:var(--transition); }
.cal-day:hover { background:var(--accent-light); }
.cal-day.other-month { color:#cbd5e1; }
.cal-day.today { background:linear-gradient(135deg,#6366f1,#764ba2); color:#fff; font-weight:700; box-shadow:0 2px 10px rgba(99,102,241,0.3); }
.cal-day.today:hover { filter:brightness(1.1); }
.cal-day.has-month { color:#8b5cf6; }
.cal-day.has-temp { color:#ef4444; }
.cal-day.has-special { color:#f59e0b; }
.cal-day.today.has-month, .cal-day.today.has-temp, .cal-day.today.has-special { color:#fff; }
.cal-dots { display:flex; justify-content:center; gap:1px; margin-top:1px; height:5px; }
.cal-dot-indicator { width:4px; height:4px; border-radius:50%; }
.cal-dot-indicator.dot-month { background:#8b5cf6; }
.cal-dot-indicator.dot-temp { background:#ef4444; }
.cal-dot-indicator.dot-special { background:#f59e0b; }
.cal-day.today .cal-dot-indicator { background:#fff !important; }

/* ===== 今日待办两列布局 ===== */
.daily-columns { display:flex; gap:20px; }
.daily-col { flex:1; min-width:0; }
.daily-col-header { display:flex; align-items:center; justify-content:space-between; padding:8px 0 12px; margin-bottom:12px; }
.daily-col-title { font-size:16px; font-weight:700; color:var(--text-primary); display:flex; align-items:center; gap:6px; }
.daily-col-count { font-size:12px; color:var(--text-muted); font-weight:400; }
.btn-add-sm { background:linear-gradient(135deg,#6366f1,#764ba2); color:#fff; border:none; padding:6px 16px; border-radius:var(--radius-sm); cursor:pointer; font-size:12px; transition:var(--transition); box-shadow:0 2px 8px rgba(99,102,241,0.25); }
.btn-add-sm:hover { filter:brightness(1.1); transform:translateY(-1px); box-shadow:0 4px 12px rgba(99,102,241,0.35); }

/* 分类分组 - Bento风格 */
.category-group { margin-bottom:12px; background:var(--card-bg); border-radius:var(--radius-md); padding:10px 14px; border:1px solid rgba(255,255,255,0.5); box-shadow:0 2px 8px rgba(0,0,0,0.04); }
.category-header { display:flex; align-items:center; padding:0 0 6px; border-bottom:1px solid rgba(0,0,0,0.05); margin-bottom:6px; }
.category-icon { font-size:16px; margin-right:8px; }
.category-name { font-size:14px; font-weight:700; color:var(--text-primary); flex:1; }
.category-count { font-size:11px; color:var(--text-muted); background:var(--accent-light); padding:2px 10px; border-radius:10px; font-weight:600; }

/* 已完成折叠组 */
.completed-group { margin-top:8px; padding-top:6px; border-top:1px dashed #e2e8f0; }
.completed-toggle { user-select:none; }
.completed-toggle:hover { color:var(--text-secondary) !important; }

/* 任务卡片 - Bento风格 */
.content-area { flex:1; overflow-y:auto; padding:0 32px 16px; }
.task-card { background:rgba(255,255,255,0.9); border-radius:var(--radius-sm); box-shadow:0 2px 6px rgba(0,0,0,0.04); margin-bottom:6px; transition:var(--transition); border-left:4px solid var(--accent); }
.task-card:hover { box-shadow:0 4px 16px rgba(0,0,0,0.1); transform:translateY(-1px); }
.task-card.priority-urgent { border-left-color:#ef4444; }
.task-card.priority-important { border-left-color:#f59e0b; }
.task-card.priority-routine { border-left-color:#3b82f6; }
.task-card.completed { opacity:.5; }
.task-card.completed .task-title { text-decoration:line-through; }
.task-card.from-monthly { border-left-color:#8b5cf6; background:rgba(139,92,246,0.04); }
.task-card.from-temp { border-left-color:#e67e22; background:rgba(230,126,34,0.04); }

.task-header { display:flex; align-items:center; padding:8px 12px; cursor:pointer; }
.task-checkbox { width:20px; height:20px; border-radius:50%; border:2px solid #cbd5e1; margin-right:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:var(--transition); flex-shrink:0; }
.task-checkbox:hover { border-color:var(--accent); }
.task-checkbox.checked { background:#22c55e; border-color:#22c55e; }
.task-checkbox.checked::after { content:"\2713"; color:#fff; font-size:11px; }
.task-title { flex:1; font-size:14px; font-weight:500; }
.task-meta { display:flex; align-items:center; gap:8px; margin-left:auto; }
.priority-tag { font-size:10px; padding:3px 8px; border-radius:6px; color:#fff; font-weight:500; }
.priority-tag.urgent { background:#ef4444; }
.priority-tag.important { background:#f59e0b; }
.priority-tag.routine { background:#3b82f6; }
.status-tag { font-size:10px; padding:3px 8px; border-radius:6px; font-weight:500; }
.status-tag.wait { background:#f1f5f9; color:#64748b; }
.status-tag.progress { background:var(--accent-light); color:var(--accent); }
.status-tag.review { background:#fef3c7; color:#d97706; }
.status-tag.done { background:#dcfce7; color:#16a34a; }
.cycle-tag { font-size:10px; padding:3px 8px; border-radius:6px; background:rgba(139,92,246,0.1); color:#8b5cf6; white-space:nowrap; font-weight:500; }
.source-tag { font-size:10px; padding:3px 8px; border-radius:6px; white-space:nowrap; font-weight:500; }
.source-tag.monthly { background:rgba(139,92,246,0.1); color:#8b5cf6; }
.source-tag.temp { background:rgba(230,126,34,0.1); color:#e67e22; }
.reminder-tag { font-size:12px; color:#ef4444; margin-left:2px; }
.toggle-switch { position:relative; display:inline-block; width:40px; height:22px; }
.toggle-switch input { opacity:0; width:0; height:0; }
.toggle-slider { position:absolute; cursor:pointer; top:0; left:0; right:0; bottom:0; background:#cbd5e1; border-radius:22px; transition:.3s; }
.toggle-slider:before { position:absolute; content:""; height:18px; width:18px; left:2px; bottom:2px; background:#fff; border-radius:50%; transition:.3s; }
.toggle-switch input:checked + .toggle-slider { background:var(--accent); }
.toggle-switch input:checked + .toggle-slider:before { transform:translateX(18px); }
.task-expand { margin-left:4px; color:var(--text-muted); transition:transform .2s; font-size:11px; }
.task-expand.open { transform:rotate(180deg); }

/* 展开详情 */
.task-detail { display:none; padding:0 14px 14px; border-top:1px solid rgba(0,0,0,0.05); }
.task-detail.show { display:block; }
.detail-section { margin-top:10px; }
.detail-label { font-size:12px; color:var(--text-muted); margin-bottom:3px; }
.meditation-track-info { display:flex; justify-content:space-between; align-items:center; }
.meditation-track-name { font-size:13px; font-weight:600; color:var(--accent); }
.meditation-track-dur { font-size:12px; color:var(--text-muted); background:#f1f5f9; padding:2px 8px; border-radius:10px; }
.meditation-tracks audio { border-radius:8px; }
.detail-text { font-size:13px; line-height:1.5; color:var(--text-secondary); }
.detail-progress { margin-top:6px; }
.progress-bar { height:6px; background:#e2e8f0; border-radius:3px; overflow:hidden; }
.progress-fill { height:100%; background:linear-gradient(90deg,#6366f1,#764ba2); border-radius:3px; transition:width .3s; }
.progress-text { font-size:11px; color:var(--text-muted); margin-top:3px; }

/* AI辅助区 */
.ai-assist { margin-top:12px; background:linear-gradient(135deg,rgba(99,102,241,0.06),rgba(118,75,162,0.06)); border-radius:10px; padding:12px; border:1px dashed rgba(99,102,241,0.3); }
.ai-assist-title { font-size:12px; color:var(--accent); font-weight:700; margin-bottom:4px; display:flex; align-items:center; gap:4px; }
.ai-assist-content { font-size:12px; color:var(--text-secondary); line-height:1.6; min-height:20px; white-space:pre-wrap; }
.ai-assist-empty { color:var(--text-muted); font-style:italic; }

/* 里程碑列表 */
.milestone-list { list-style:none; margin-top:6px; }
.milestone-item { display:flex; align-items:center; padding:3px 0; font-size:12px; }
.milestone-check { width:14px; height:14px; border:1.5px solid #cbd5e1; border-radius:4px; margin-right:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:var(--transition); }
.milestone-check:hover { border-color:var(--accent); }
.milestone-check.checked { background:#22c55e; border-color:#22c55e; }
.milestone-check.checked::after { content:"\2713"; color:#fff; font-size:9px; }

/* OKR关键结果 */
.kr-list { margin-top:8px; }
.kr-item { background:rgba(255,255,255,0.8); border:1px solid #e2e8f0; border-radius:10px; padding:10px; margin-bottom:8px; }
.kr-title { font-size:13px; font-weight:500; margin-bottom:6px; }

/* 笔记相关 - Bento卡片风格 */
.note-card { background:var(--card-bg); border-radius:var(--radius-sm); margin-bottom:10px; border-left:4px solid var(--accent); box-shadow:0 2px 8px rgba(0,0,0,0.04); transition:var(--transition); }
.note-card:hover { box-shadow:0 4px 16px rgba(0,0,0,0.1); transform:translateY(-1px); }
.note-card.status-want { border-left-color:#3b82f6; }
.note-card.status-doing { border-left-color:#f59e0b; }
.note-card.status-done { border-left-color:#22c55e; }
.note-header { display:flex; align-items:center; padding:10px 14px; cursor:pointer; gap:10px; }
.note-title { font-size:15px; font-weight:600; flex:1; }
.note-meta { display:flex; align-items:center; gap:6px; flex-wrap:wrap; }
.note-status-tag { font-size:10px; padding:3px 10px; border-radius:12px; color:#fff; white-space:nowrap; font-weight:500; }
.note-status-tag.want { background:#3b82f6; }
.note-status-tag.doing { background:#f59e0b; }
.note-status-tag.done { background:#22c55e; }
.note-category-tag { font-size:10px; padding:3px 8px; border-radius:6px; background:var(--accent-light); color:var(--accent); font-weight:500; }
.note-rating { color:#f59e0b; font-size:14px; letter-spacing:1px; }
.note-detail { display:none; padding:0 14px 14px; border-top:1px solid rgba(0,0,0,0.05); }
.note-detail.open { display:block; }
.note-content { white-space:pre-wrap; font-size:13px; color:var(--text-secondary); line-height:1.6; padding:10px; background:#f8fafc; border-radius:8px; margin:8px 0; }
.note-info-grid { display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:8px; }
.note-info-item { font-size:12px; color:var(--text-secondary); }
.note-info-label { color:var(--text-muted); margin-right:4px; }
.note-add-btn { background:linear-gradient(135deg,#6366f1,#764ba2); color:#fff; border:none; padding:10px 20px; border-radius:var(--radius-sm); font-size:14px; cursor:pointer; margin-bottom:16px; box-shadow:0 2px 10px rgba(99,102,241,0.25); transition:var(--transition); }
.note-add-btn:hover { filter:brightness(1.1); transform:translateY(-1px); }
.note-empty { text-align:center; padding:60px 20px; color:var(--text-muted); }
.note-empty-icon { font-size:48px; margin-bottom:12px; }
.note-group-title { font-size:13px; color:var(--text-secondary); font-weight:700; margin:16px 0 8px; padding-left:4px; border-bottom:1px solid #e2e8f0; padding-bottom:4px; }
.star { display:inline-block; }

/* 笔记弹窗优化 - Bento风格 */
.nm-overlay { display:none; position:fixed; top:0; left:0; right:0; bottom:0; background:rgba(0,0,0,0.45); z-index:1000; align-items:center; justify-content:center; animation:nmFadeIn .2s; backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px); }
.nm-overlay.show { display:flex; }
@keyframes nmFadeIn { from{opacity:0} to{opacity:1} }
.nm-dialog { background:rgba(255,255,255,0.95); backdrop-filter:blur(20px); -webkit-backdrop-filter:blur(20px); border:1px solid var(--glass-border); border-radius:var(--glass-radius); width:92%; max-width:680px; max-height:90vh; overflow-y:auto; box-shadow:0 12px 48px rgba(0,0,0,0.2); animation:nmSlideUp .25s; }
@keyframes nmSlideUp { from{transform:translateY(20px);opacity:0} to{transform:translateY(0);opacity:1} }
.nm-header { display:flex; justify-content:space-between; align-items:center; padding:24px 32px 14px; }
.nm-header h3 { margin:0; font-size:20px; font-weight:700; color:var(--text-primary); }
.nm-close { background:none; border:none; font-size:26px; cursor:pointer; color:var(--text-muted); line-height:1; padding:0; width:36px; height:36px; border-radius:50%; display:flex; align-items:center; justify-content:center; transition:var(--transition); }
.nm-close:hover { background:#f1f5f9; color:var(--text-primary); }
.nm-body { padding:0 32px 8px; }
.nm-field { margin-bottom:20px; }
.nm-label { display:block; font-size:14px; color:var(--text-secondary); margin-bottom:8px; font-weight:600; }
.nm-input { width:100%; padding:12px 16px; border:1.5px solid #e2e8f0; border-radius:var(--radius-sm); font-size:15px; box-sizing:border-box; transition:var(--transition); background:#f8fafc; }
.nm-input:focus { outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(99,102,241,0.1); }
.nm-textarea { width:100%; padding:12px 16px; border:1.5px solid #e2e8f0; border-radius:var(--radius-sm); font-size:15px; box-sizing:border-box; resize:vertical; line-height:1.7; background:#f8fafc; font-family:inherit; transition:var(--transition); }
.nm-textarea:focus { outline:none; border-color:var(--accent); background:#fff; box-shadow:0 0 0 3px rgba(99,102,241,0.1); }

/* 状态分段选择 */
.nm-status-group { display:flex; gap:0; border:1.5px solid #e2e8f0; border-radius:var(--radius-sm); overflow:hidden; }
.nm-status-btn { flex:1; padding:11px 0; text-align:center; font-size:14px; cursor:pointer; background:#f8fafc; color:var(--text-muted); border:none; transition:var(--transition); font-family:inherit; font-weight:500; }
.nm-status-btn:hover { background:#f1f5f9; }
.nm-status-btn.active { background:linear-gradient(135deg,#6366f1,#764ba2); color:#fff; }
.nm-status-btn+.nm-status-btn { border-left:1px solid #e2e8f0; }

/* 分类标签chips */
.nm-chips { display:flex; flex-wrap:wrap; gap:6px; }
.nm-chip { padding:8px 16px; border:1.5px solid #e2e8f0; border-radius:20px; font-size:13px; cursor:pointer; color:var(--text-secondary); background:#f8fafc; transition:var(--transition); user-select:none; font-weight:500; }
.nm-chip:hover { border-color:var(--accent); color:var(--accent); }
.nm-chip.active { background:var(--accent-light); border-color:var(--accent); color:var(--accent); font-weight:600; }

/* 评分星星 */
.nm-rating-row { display:flex; align-items:center; gap:8px; }
.nm-stars { display:flex; gap:2px; }
.nm-star { font-size:32px; cursor:pointer; color:#e2e8f0; transition:color .1s; user-select:none; line-height:1; }
.nm-star.active { color:#FFAC2D; }
.nm-star:hover { color:#FFAC2D; }
.nm-rating-text { font-size:14px; color:var(--text-muted); margin-left:8px; }

/* 日期并排 */
.nm-date-row { display:flex; gap:12px; }
.nm-date-row .nm-field { flex:1; margin-bottom:18px; }

/* 底部按钮 */
.nm-footer { display:flex; gap:12px; justify-content:flex-end; padding:14px 32px 24px; }
.nm-btn { padding:11px 28px; border-radius:var(--radius-sm); font-size:15px; cursor:pointer; font-family:inherit; transition:var(--transition); font-weight:600; }
.nm-btn-cancel { border:1.5px solid #e2e8f0; background:#fff; color:var(--text-secondary); }
.nm-btn-cancel:hover { background:#f8fafc; }
.nm-btn-save { border:none; background:linear-gradient(135deg,#6366f1,#764ba2); color:#fff; box-shadow:0 2px 10px rgba(99,102,241,0.3); }
.nm-btn-save:hover { filter:brightness(1.1); transform:translateY(-1px); box-shadow:0 4px 14px rgba(99,102,241,0.4); }

/* 操作按钮 */
.task-actions { margin-top:10px; display:flex; gap:6px; }
.btn-sm { padding:4px 10px; border-radius:6px; border:1px solid #e2e8f0; background:#fff; cursor:pointer; font-size:11px; transition:var(--transition); }
.btn-sm:hover { background:#f8fafc; }
.btn-sm.btn-danger { color:#ef4444; border-color:#ef4444; }

/* 智能合并：将本地数据与云端数据字段级合并，确保不丢失任何端的数据 */
function mergeData(local, cloud) {
  if (!cloud || !cloud.daily) return local;
  if (!local || !local.daily) return cloud;

  var merged = JSON.parse(JSON.stringify(local)); // 以本地为基底

  // 同步已有条目的文本字段（title/desc/cycleLabel/priority等）：
  // 云端有值且与本地不同时，采用"较新者覆盖"策略
  function syncItemFields(localItem, cloudItem) {
    if (!cloudItem) return;
    // 需要同步的字段列表（不含id/createdAt/completed/status等状态字段）
    var fields = ['title','desc','priority','cycleLabel','cycleDay','icon','repeat','color','progress','deadline','category','rating','startDate','endDate'];
    for (var fi = 0; fi < fields.length; fi++) {
      var f = fields[fi];
      if (cloudItem[f] !== undefined && cloudItem[f] !== localItem[f]) {
        localItem[f] = cloudItem[f];
      }
    }
  }

  // --- 合并 daily 任务（以id为key）---
  var cloudDailyMap = {};
  for (var i = 0; i < cloud.daily.length; i++) cloudDailyMap[cloud.daily[i].id] = cloud.daily[i];

  // 跨日重置判断：如果本地已重置到新日期，云端的完成状态不应"复活"
  var localResetDate = local.lastResetDate || '';
  var cloudResetDate = cloud.lastResetDate || '';
  var sameDay = localResetDate === cloudResetDate && localResetDate !== '';

  for (var i = 0; i < merged.daily.length; i++) {
    var item = merged.daily[i];
    var cloudItem = cloudDailyMap[item.id];
    if (cloudItem) {
      // 完成状态合并：只有同一日期内才合并完成状态（防止跨日重置被云端旧状态覆盖）
      if (sameDay && cloudItem.completed && !item.completed) item.completed = true;
      // aiAssist：AI脚本是唯一写入者，云端有不同值时直接用云端（避免本地旧值覆盖AI新值）
      if (cloudItem.aiAssist && cloudItem.aiAssist !== item.aiAssist) {
        item.aiAssist = cloudItem.aiAssist;
      }
      // 同步文本字段
      syncItemFields(item, cloudItem);
    }
  }

  // 云端有但本地没有的任务（另一设备新添加的）→ 追加到本地
  var localDailyIds = {};
  for (var i = 0; i < merged.daily.length; i++) localDailyIds[merged.daily[i].id] = true;
  for (var id in cloudDailyMap) {
    if (!localDailyIds[id]) merged.daily.push(cloudDailyMap[id]);
  }

  // --- 合并 tempTasks（以id为key）---
  var cloudTempMap = {};
  for (var i = 0; i < (cloud.tempTasks||[]).length; i++) cloudTempMap[cloud.tempTasks[i].id] = cloud.tempTasks[i];
  for (var i = 0; i < (merged.tempTasks||[]).length; i++) {
    var t = merged.tempTasks[i];
    var ct = cloudTempMap[t.id];
    if (ct) {
      if (ct.completed && !t.completed) t.completed = true;
      // emailReminder：云端有值则同步（用户在另一设备可能刚设置了提醒）
      if (ct.emailReminder !== undefined && ct.emailReminder !== t.emailReminder) t.emailReminder = ct.emailReminder;
      syncItemFields(t, ct);
    }
  }
  var localTempIds = {};
  for (var i = 0; i < (merged.tempTasks||[]).length; i++) localTempIds[merged.tempTasks[i].id] = true;
  for (var id in cloudTempMap) {
    if (!localTempIds[id]) (merged.tempTasks||(merged.tempTasks=[])).push(cloudTempMap[id]);
  }

  // --- 合并 midterm（月度周期任务，以id为key）---
  var cloudMidMap = {};
  for (var i = 0; i < (cloud.midterm||[]).length; i++) cloudMidMap[cloud.midterm[i].id] = cloud.midterm[i];
  for (var i = 0; i < (merged.midterm||[]).length; i++) {
    var m = merged.midterm[i];
    var cm = cloudMidMap[m.id];
    if (cm) {
      if (cm.status === 'done' && m.status !== 'done') m.status = 'done';
      syncItemFields(m, cm);
    }
  }
  var localMidIds = {};
  for (var i = 0; i < (merged.midterm||[]).length; i++) localMidIds[merged.midterm[i].id] = true;
  for (var id in cloudMidMap) {
    if (!localMidIds[id]) (merged.midterm||(merged.midterm=[])).push(cloudMidMap[id]);
  }

  // --- 合并 longterm（长期事项，以id为key）---
  var cloudLtMap = {};
  for (var i = 0; i < (cloud.longterm||[]).length; i++) cloudLtMap[cloud.longterm[i].id] = cloud.longterm[i];
  // 先同步已有条目的字段
  for (var i = 0; i < (merged.longterm||[]).length; i++) {
    var lt = merged.longterm[i];
    var clt = cloudLtMap[lt.id];
    if (clt) syncItemFields(lt, clt);
  }
  for (var id in cloudLtMap) {
    var found = false;
    for (var i = 0; i < (merged.longterm||[]).length; i++) {
      if (merged.longterm[i].id === id) { found = true; break; }
    }
    if (!found) (merged.longterm||(merged.longterm=[])).push(cloudLtMap[id]);
  }

  // --- 合并 monthlyCompleted（月度任务完成记录，并集）---
  if (cloud.monthlyCompleted) {
    merged.monthlyCompleted = merged.monthlyCompleted || {};
    for (var key in cloud.monthlyCompleted) {
      if (!merged.monthlyCompleted[key]) merged.monthlyCompleted[key] = cloud.monthlyCompleted[key];
    }
  }

  // --- lastResetDate：取较新的日期 ---
  if (cloud.lastResetDate && cloud.lastResetDate > (merged.lastResetDate || '')) {
    merged.lastResetDate = cloud.lastResetDate;
  }

  // --- 合并 bookNotes（读书笔记，以id为key）---
  if (cloud.bookNotes && cloud.bookNotes.length) {
    if (!merged.bookNotes) merged.bookNotes = [];
    // 同步已有条目的字段
    var cloudBookMap = {};
    for (var i = 0; i < cloud.bookNotes.length; i++) cloudBookMap[cloud.bookNotes[i].id] = cloud.bookNotes[i];
    for (var i = 0; i < merged.bookNotes.length; i++) {
      var cb = cloudBookMap[merged.bookNotes[i].id];
      if (cb) syncItemFields(merged.bookNotes[i], cb);
    }
    var localBookIds = {};
    for (var i = 0; i < merged.bookNotes.length; i++) localBookIds[merged.bookNotes[i].id] = true;
    for (var i = 0; i < cloud.bookNotes.length; i++) {
      if (!localBookIds[cloud.bookNotes[i].id]) merged.bookNotes.push(cloud.bookNotes[i]);
    }
  }

  // --- 合并 movieNotes（影视笔记，以id为key）---
  if (cloud.movieNotes && cloud.movieNotes.length) {
    if (!merged.movieNotes) merged.movieNotes = [];
    // 同步已有条目的字段
    var cloudMovieMap = {};
    for (var i = 0; i < cloud.movieNotes.length; i++) cloudMovieMap[cloud.movieNotes[i].id] = cloud.movieNotes[i];
    for (var i = 0; i < merged.movieNotes.length; i++) {
      var cm = cloudMovieMap[merged.movieNotes[i].id];
      if (cm) syncItemFields(merged.movieNotes[i], cm);
    }
    var localMovieIds = {};
    for (var i = 0; i < merged.movieNotes.length; i++) localMovieIds[merged.movieNotes[i].id] = true;
    for (var i = 0; i < cloud.movieNotes.length; i++) {
      if (!localMovieIds[cloud.movieNotes[i].id]) merged.movieNotes.push(cloud.movieNotes[i]);
    }
  }

  // --- 合并 memos（便签，以id为key）---
  if (cloud.memos && cloud.memos.length) {
    if (!merged.memos) merged.memos = [];
    // 同步已有条目的字段
    var cloudMemoMap = {};
    for (var i = 0; i < cloud.memos.length; i++) cloudMemoMap[cloud.memos[i].id] = cloud.memos[i];
    for (var i = 0; i < merged.memos.length; i++) {
      var cm = cloudMemoMap[merged.memos[i].id];
      if (cm) syncItemFields(merged.memos[i], cm);
    }
    var localMemoIds = {};
    for (var i = 0; i < merged.memos.length; i++) localMemoIds[merged.memos[i].id] = true;
    for (var i = 0; i < cloud.memos.length; i++) {
      if (!localMemoIds[cloud.memos[i].id]) merged.memos.push(cloud.memos[i]);
    }
  }

  // --- 合并 countdowns（倒计时，以id为key）---
  if (cloud.countdowns && cloud.countdowns.length) {
    if (!merged.countdowns) merged.countdowns = [];
    // 同步已有条目的字段
    var cloudCdMap = {};
    for (var i = 0; i < cloud.countdowns.length; i++) cloudCdMap[cloud.countdowns[i].id] = cloud.countdowns[i];
    for (var i = 0; i < merged.countdowns.length; i++) {
      var cc = cloudCdMap[merged.countdowns[i].id];
      if (cc) syncItemFields(merged.countdowns[i], cc);
    }
    var localCdIds = {};
    for (var i = 0; i < merged.countdowns.length; i++) localCdIds[merged.countdowns[i].id] = true;
    for (var i = 0; i < cloud.countdowns.length; i++) {
      if (!localCdIds[cloud.countdowns[i].id]) merged.countdowns.push(cloud.countdowns[i]);
    }
  }

  // --- 合并 journal（心语，以date为key）---
  if (cloud.journal) {
    if (!merged.journal) merged.journal = {};
    for (var dateKey in cloud.journal) {
      if (!merged.journal[dateKey]) merged.journal[dateKey] = cloud.journal[dateKey];
    }
  }

  // --- 合并 deletedIds（并集，用于过滤已删除条目）---
  merged.deletedIds = merged.deletedIds || [];
  if (cloud.deletedIds && cloud.deletedIds.length) {
    for (var i = 0; i < cloud.deletedIds.length; i++) {
      if (merged.deletedIds.indexOf(cloud.deletedIds[i]) < 0) merged.deletedIds.push(cloud.deletedIds[i]);
    }
  }
  // 用 deletedIds 过滤所有数组类型，防止已删除条目被云端旧数据复活
  var _deletedSet = {};
  for (var i = 0; i < (merged.deletedIds||[]).length; i++) _deletedSet[merged.deletedIds[i]] = true;
  function _filterDeleted(arr) {
    if (!arr || !arr.length) return arr;
    var out = [];
    for (var i = 0; i < arr.length; i++) {
      if (arr[i] && arr[i].id && !_deletedSet[arr[i].id]) out.push(arr[i]);
      else if (arr[i] && !arr[i].id) out.push(arr[i]); // 无id的保留
    }
    return out;
  }
  merged.daily = _filterDeleted(merged.daily);
  merged.tempTasks = _filterDeleted(merged.tempTasks);
  merged.midterm = _filterDeleted(merged.midterm);
  merged.longterm = _filterDeleted(merged.longterm);
  merged.bookNotes = _filterDeleted(merged.bookNotes);
  merged.movieNotes = _filterDeleted(merged.movieNotes);
  merged.memos = _filterDeleted(merged.memos);
  merged.countdowns = _filterDeleted(merged.countdowns);

  // --- 时间戳：取较新者，再更新为当前时间 ---
  var now = new Date().toISOString();
  var cloudTime = cloud._lastModified || '';
  var localTime = local._lastModified || '';
  merged._lastModified = now;

  return merged;
}

/* syncToGist: 推送前先拉取云端数据，智能合并后再推送（根治数据覆盖问题） */
function syncToGist(data) {
  var token = getGitHubToken();
  if (!token) {
    updateSyncStatus('cloud-no-token');
    return;
  }
  if (cloudSyncing) return; // 防止并发
  cloudSyncing = true;

  // 步骤1：先拉取云端最新数据
  loadFromGist(function(cloudData, err) {
    if (cloudData && cloudData.daily) {
      // 步骤2：智能合并本地与云端
      var merged = mergeData(data, cloudData);
      // 更新本地appData为合并结果（这样本地也有云端的新数据）
      appData = merged;
      localStorage.setItem(LS_CACHE_KEY, JSON.stringify(appData));
      // 步骤3：推送合并后的数据
      _doGistPush(merged);
    } else {
      // 云端拉取失败→不推了，避免用本地数据盲覆盖
      cloudSyncing = false;
      updateSyncStatus('cloud-error');
      console.log('syncToGist: 云端拉取失败，放弃推送以避免覆盖');
    }
  });
}

/* 实际执行Gist PATCH推送 */
function _doGistPush(data) {
  var token = getGitHubToken();
  var payload = {
    description: 'GZT Workbench Data',
    files: {}
  };
  payload.files[GIST_FILENAME] = {
    content: JSON.stringify(data, null, 2)
  };
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('PATCH', GIST_API, true);
    xhr.setRequestHeader('Authorization', 'token ' + token);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        cloudSyncing = false;
        if (xhr.status >= 200 && xhr.status < 300) {
          lastCloudSync = new Date();
          updateSyncStatus('cloud-ok');
        } else {
          updateSyncStatus('cloud-error');
          console.log('Gist sync error:', xhr.status, xhr.responseText);
        }
      }
    };
    xhr.send(JSON.stringify(payload));
  } catch(e) {
    cloudSyncing = false;
    updateSyncStatus('cloud-error');
  }
}

function loadFromGist(callback) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', GIST_API, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var gist = JSON.parse(xhr.responseText);
          var content = gist.files[GIST_FILENAME].content;
          var cloudData = JSON.parse(content);
          callback(cloudData, null);
        } catch(e) {
          callback(null, '解析失败');
        }
      } else {
        callback(null, 'HTTP ' + xhr.status);
      }
    }
  };
  xhr.send();
}

/* ===== 同步状态显示 ===== */
function updateSyncStatus(state) {
  var el = document.getElementById('sync-status');
  if (!el) return;
  switch(state) {
    case 'cloud-ok':
      el.textContent = '☁️ 云端已同步 ' + new Date().toLocaleTimeString('zh-CN');
      el.style.color = '#22c55e'; break;
    case 'cloud-no-token':
      el.textContent = '⚠️ 未配置Token，仅本地';
      el.style.color = '#f59e0b'; break;
    case 'cloud-error':
      el.textContent = '☁️ 云端同步失败';
      el.style.color = '#ef4444'; break;
    case 'cloud-loading':
      el.textContent = '☁️ 正在同步...';
      el.style.color = '#6366f1'; break;
    case 'local-only':
      el.textContent = '本地模式';
      el.style.color = '#999'; break;
  }
}

/* ===== 导出/导入数据 ===== */
function exportDataFile() {
  var jsonStr = JSON.stringify(appData, null, 2);
  var blob = new Blob([jsonStr], { type: 'application/json' });
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a');
  a.href = url;
  a.download = 'workbench_data.json';
  a.click();
  URL.revokeObjectURL(url);
}

function importDataFile() {
  var input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = function(e) {
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(ev) {
      try {
        var imported = JSON.parse(ev.target.result);
        if (imported.daily) {
          if (confirm('确定导入数据？当前数据将被替换！（共' + (imported.daily.length||0) + '条日常+' + (imported.midterm.length||0) + '条月度）')) {
            appData = imported;
            saveData(appData);
            renderContent();
            renderCalendar();
            alert('数据导入成功！');
          }
        } else {
          alert('文件格式不正确，请选择工作台导出的JSON文件。');
        }
      } catch(err) {
        alert('文件解析失败: ' + err.message);
      }
    };
    reader.readAsText(file);
  };
  input.click();
}

/* ============================================================ */
var COUNTDOWN_ICONS = ['🎂','💕','💍','👶','🏠','✈️','🏖️','🎓','🎉','📅','💼','💰','📚','🎄','🎁','⭐'];

function renderCountdowns(area) {
  if (!appData.countdowns) appData.countdowns = [];
  area.innerHTML = '';

  // 添加按钮
  var header = document.createElement('div');
  header.style.cssText = 'display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;';
  header.innerHTML = '<div style="font-size:13px;color:#888;">共 <b>' + appData.countdowns.length + '</b> 个</div><button class="note-add-btn" onclick="openCountdownModal()">+ 添加纪念日</button>';
  area.appendChild(header);

  if (!appData.countdowns.length) {
    area.innerHTML += '<div class="countdown-empty"><div class="countdown-empty-icon">💝</div><p>还没有纪念日</p><p style="font-size:12px;color:#bbb;margin-top:4px;">添加生日、恋爱纪念日、孩子出生日等重要日期</p></div>';
    return;
  }

  var now = new Date();
  now.setHours(0, 0, 0, 0);

  // 排序：将来的排前面（按天数升序），过去的排后面（按天数降序）
  var sorted = appData.countdowns.slice().sort(function(a, b) {
    var aInfo = calcAnniversary(a, now);
    var bInfo = calcAnniversary(b, now);
    if (aInfo.isFuture && !bInfo.isFuture) return -1;
    if (!aInfo.isFuture && bInfo.isFuture) return 1;
    if (aInfo.isFuture) return aInfo.displayDays - bInfo.displayDays;
    return bInfo.displayDays - aInfo.displayDays;
  });

  var grid = document.createElement('div');
  grid.className = 'countdown-grid fade-in';
  for (var i = 0; i < sorted.length; i++) {
    grid.appendChild(createCountdownCard(sorted[i], now));
  }
  area.appendChild(grid);
}

/* 计算纪念日的显示信息 */
function calcAnniversary(item, now) {
  var origDate = new Date(item.date + 'T00:00:00');
  var diffMs = origDate - now;
  var diffDays = Math.round(diffMs / (1000 * 60 * 60 * 24));

  var result = {
    diffDays: diffDays,
    isFuture: diffDays > 0,
    isToday: diffDays === 0,
    isPast: diffDays < 0,
    displayDays: Math.abs(diffDays),
    origDate: origDate,
    nextAnniversary: null,
    yearsPassed: 0,
    nextDays: 0
  };

  // 计算周年纪念（如果是重复纪念日）
  if (item.repeat && diffDays < 0) {
    var years = Math.floor(Math.abs(diffDays) / 365);
    // 粗略计算下一个周年日期
    var nextAnniv = new Date(origDate);
    nextAnniv.setFullYear(now.getFullYear());
    if (nextAnniv < now) {
      nextAnniv.setFullYear(now.getFullYear() + 1);
    }
    var nextDiff = Math.round((nextAnniv - now) / (1000 * 60 * 60 * 24));
    result.yearsPassed = Math.floor((now - origDate) / (365.25 * 24 * 60 * 60 * 1000));
    result.nextAnniversary = nextAnniv;
    result.nextDays = nextDiff;
  }

  return result;
}

function createCountdownCard(item, now) {
  var card = document.createElement('div');
  card.className = 'countdown-card fade-in';

  var info = calcAnniversary(item, now);
  var urgencyClass = 'normal';

  if (info.isToday) {
    urgencyClass = 'urgent';
  } else if (info.isFuture && info.displayDays <= 7) {
    urgencyClass = 'soon';
  } else if (info.isPast) {
    urgencyClass = 'past';
  }
  card.classList.add(urgencyClass);

  var dateDisplay = item.date ? new Date(item.date + 'T00:00:00').toLocaleDateString('zh-CN', {year:'numeric',month:'long',day:'numeric',weekday:'long'}) : '';

  // 主体数字显示
  var numberHtml = '';
  if (info.isToday) {
    if (item.repeat && info.yearsPassed > 0) {
      numberHtml = '<span class="countdown-number" style="font-size:28px;">第' + (info.yearsPassed + 1) + '个周年</span>';
    } else {
      numberHtml = '<span class="countdown-number" style="font-size:28px;">就是今天</span>';
    }
  } else if (info.isFuture) {
    numberHtml = '<span class="countdown-number">' + info.displayDays + '</span><span class="countdown-unit">天后</span>';
  } else {
    // 过去的日期
    if (item.repeat) {
      // 重复纪念日：显示已过天数 + 周年数 + 距下次周年天数
      numberHtml = '<span class="countdown-number">' + info.displayDays + '</span><span class="countdown-unit">天</span>';
      if (info.yearsPassed > 0) {
        numberHtml += '<div style="font-size:13px;color:var(--text-muted);margin-top:6px;">已第 <b style="color:var(--accent);">' + info.yearsPassed + '</b> 周年 · 下次还有 <b style="color:var(--accent);">' + info.nextDays + '</b> 天</div>';
      }
    } else {
      // 普通过去日期：只显示已过天数
      numberHtml = '<span class="countdown-number">' + info.displayDays + '</span><span class="countdown-unit">天前</span>';
    }
  }

  // 重复标记
  var repeatBadge = item.repeat ? '<span style="font-size:10px;padding:2px 8px;border-radius:10px;background:rgba(139,92,246,0.1);color:#8b5cf6;font-weight:600;margin-left:6px;">🔁 每年</span>' : '';

  card.innerHTML =
    '<div class="countdown-icon">' + (item.icon || '💝') + '</div>' +
    '<div class="countdown-title">' + esc(item.title) + repeatBadge + '</div>' +
    '<div class="countdown-date">' + dateDisplay + '</div>' +
    '<div>' + numberHtml + '</div>' +
    '<div class="countdown-actions">' +
      '<button class="btn-sm" onclick="openCountdownModal(\'' + item.id + '\')">编辑</button>' +
      '<button class="btn-sm btn-danger" onclick="deleteCountdown(\'' + item.id + '\')">删除</button>' +
    '</div>';
  return card;
}

/* ===== 首次打开拉取云端数据 ===== */
function initCloudSync() {
  var token = getGitHubToken();
  var localTime = appData._lastModified || localStorage.getItem('workbench_save_time') || '';

  if (!token) {
    // 没有Token：仅当本地没有有效数据时才从Gist拉取；绝不推送（没Token也推不了）
    var hasRealData = localTime || (appData.daily && appData.daily.some(function(d){ return d.completed; }));
    if (!hasRealData) {
      updateSyncStatus('cloud-loading');
      loadFromGist(function(cloudData, err) {
        if (cloudData && cloudData.daily && cloudData.daily.length > 0) {
          appData = cloudData;
          localStorage.setItem(LS_CACHE_KEY, JSON.stringify(appData));
          renderContent();
          renderCalendar();
        }
        updateSyncStatus('cloud-no-token');
      });
    } else {
      updateSyncStatus('cloud-no-token');
    }
    return;
  }

  // 有Token：从云端拉取，使用智能合并（不再做"谁覆盖谁"的简单判断）
  updateSyncStatus('cloud-loading');
  loadFromGist(function(cloudData, err) {
    if (cloudData && cloudData.daily && cloudData.daily.length > 0) {
      // 智能合并：保留两端的完成状态、aiAssist、新增任务，不丢任何数据
      appData = mergeData(appData, cloudData);
      localStorage.setItem(LS_CACHE_KEY, JSON.stringify(appData));
      renderContent();
      renderCalendar();
      // 推送合并后的数据到云端（保持云端也是最新的合并结果）
      _doGistPush(appData);
      updateSyncStatus('cloud-ok');
    } else {
      // 云端无数据或拉取失败 → 不动本地数据，绝不推送空状态上去
      updateSyncStatus('cloud-error');
    }
  });
}

/* ===== 月历 ===== */
function initCalendar() {
  var now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();
}

function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }
function calToday() { var now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth(); renderCalendar(); }

function renderCalendar() {
  document.getElementById('cal-month-label').textContent = calYear+'年'+(calMonth+1)+'月';
  var grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  // 星期标题
  var weekLabels = ['一','二','三','四','五','六','日'];
  for(var w=0;w<7;w++){
    var wd = document.createElement('div');
    wd.className = 'cal-weekday';
    wd.textContent = weekLabels[w];
    grid.appendChild(wd);
  }

  var firstDay = new Date(calYear, calMonth, 1);
  var startWeekday = firstDay.getDay(); // 0=日
  startWeekday = startWeekday === 0 ? 6 : startWeekday - 1; // 转为0=一
  var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  var prevDays = new Date(calYear, calMonth, 0).getDate();

  var today = new Date();
  var todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();

  // 获取本月有月度待办的日期
  var monthlyDays = getMonthlyTaskDays(calYear, calMonth+1);
  // 获取临时任务截止日
  var tempDeadlineDays = getTempDeadlineDays(calYear, calMonth+1);

  // 上月填充
  for(var i=startWeekday-1;i>=0;i--){
    var d = document.createElement('div');
    d.className = 'cal-day other-month';
    d.innerHTML = '<div>'+(prevDays-i)+'</div><div class="cal-dots"></div>';
    grid.appendChild(d);
  }

  // 本月
  for(var day=1;day<=daysInMonth;day++){
    var d = document.createElement('div');
    var isToday = (calYear===todayY && calMonth===todayM && day===todayD);
    var classes = ['cal-day'];
    if(isToday) classes.push('today');

    var dotHtml = '<div class="cal-dots">';
    if(monthlyDays.indexOf(day)>=0){ classes.push('has-month'); dotHtml+='<span class="cal-dot-indicator dot-month"></span>'; }
    if(tempDeadlineDays.indexOf(day)>=0){ classes.push('has-temp'); dotHtml+='<span class="cal-dot-indicator dot-temp"></span>'; }
    var specialKey = (calMonth+1)+'-'+day;
    if(SPECIAL_DATES[specialKey]){ classes.push('has-special'); dotHtml+='<span class="cal-dot-indicator dot-special"></span>'; }
    dotHtml += '</div>';

    d.className = classes.join(' ');
    d.innerHTML = '<div>'+day+'</div>'+dotHtml;
    grid.appendChild(d);
  }

  // 下月填充（补满6行）
  var totalCells = startWeekday + daysInMonth;
  var remaining = (7 - totalCells%7)%7;
  for(var i=1;i<=remaining;i++){
    var d = document.createElement('div');
    d.className = 'cal-day other-month';
    d.innerHTML = '<div>'+i+'</div><div class="cal-dots"></div>';
    grid.appendChild(d);
  }
}

function getMonthlyTaskDays(year, month) {
  var days = [];
  for(var i=0;i<appData.midterm.length;i++){
    var item = appData.midterm[i];
    if(item.cycleMonths && item.cycleMonths.length){
      // 季度任务
      for(var j=0;j<item.cycleMonths.length;j++){
        if(item.cycleMonths[j]===month && item.cycleDay) days.push(item.cycleDay);
      }
    } else if(item.cycleDay){
      days.push(item.cycleDay);
    }
  }
  // 去重
  var unique = [];
  for(var i=0;i<days.length;i++){ if(unique.indexOf(days[i])<0) unique.push(days[i]); }
  unique.sort(function(a,b){return a-b;});
  return unique;
}

function getTempDeadlineDays(year, month) {
  var days = [];
  for(var i=0;i<appData.tempTasks.length;i++){
    var t = appData.tempTasks[i];
    if(t.tempDeadline){
      var parts = t.tempDeadline.split('-');
      if(parseInt(parts[0])===year && parseInt(parts[1])===month){
        days.push(parseInt(parts[2]));
      }
    }
  }
  var unique = [];
  for(var i=0;i<days.length;i++){ if(unique.indexOf(days[i])<0) unique.push(days[i]); }
  unique.sort(function(a,b){return a-b;});
  return unique;
}

/* ===== 判断月度任务今天是否触发 ===== */
function getTodayMonthlyItems() {
  var today = new Date();
  var day = today.getDate();
  var month = today.getMonth()+1;
  var result = [];
  for(var i=0;i<appData.midterm.length;i++){
    var item = appData.midterm[i];
    if(item.cycleDay === day){
      if(item.cycleMonths && item.cycleMonths.length){
        if(item.cycleMonths.indexOf(month)>=0) result.push(item);
      } else {
        result.push(item);
      }
    }
  }
  return result;
}

var noteModalType = '';
var noteEditId = null;

function openNoteModal(type, editId) {
  noteModalType = type;
  noteEditId = editId || null;
  var item = null;
  if(noteEditId){
    var arr = type==='book' ? appData.bookNotes : appData.movieNotes;
    for(var i=0;i<arr.length;i++){
      if(arr[i].id===noteEditId){ item=arr[i]; break; }
    }
  }

  var isBook = type==='book';
  var categories = isBook ? BOOK_CATEGORIES : MOVIE_CATEGORIES;
  var statusMap = isBook ? BOOK_STATUS : MOVIE_STATUS;
  var currentStatus = item ? (item.status || 'want') : 'want';
  var currentCategory = item ? (item.category || '') : '';
  var rating = item ? (item.rating || 0) : 0;

  // 分类标签chips
  var chipsHtml = '<div class="nm-chips">';
  for(var i=0;i<categories.length;i++){
    var cls = currentCategory===categories[i] ? ' active' : '';
    chipsHtml += '<span class="nm-chip'+cls+'" onclick="selectNoteChip(this,\''+categories[i]+'\')">'+categories[i]+'</span>';
  }
  chipsHtml += '</div><input type="hidden" id="nm-category" value="'+currentCategory+'">';

  // 状态分段按钮
  var statusKeys = ['want','doing','done'];
  var statusHtml = '<div class="nm-status-group">';
  for(var i=0;i<statusKeys.length;i++){
    var key = statusKeys[i];
    var cls = currentStatus===key ? ' active' : '';
    statusHtml += '<button class="nm-status-btn'+cls+'" onclick="selectNoteStatus(this,\''+key+'\')" type="button">'+statusMap[key]+'</button>';
  }
  statusHtml += '</div><input type="hidden" id="nm-status" value="'+currentStatus+'">';

function closeNoteModal() {
  var modal = document.getElementById('note-modal');
  if(modal) modal.classList.remove('show');

}

function selectNoteStatus(btn, val) {
  var siblings = btn.parentNode.querySelectorAll('.nm-status-btn');
  for(var i=0;i<siblings.length;i++) siblings[i].classList.remove('active');
  btn.classList.add('active');
  document.getElementById('nm-status').value = val;
}

function selectNoteChip(el, val) {
  var siblings = el.parentNode.querySelectorAll('.nm-chip');
  for(var i=0;i<siblings.length;i++) siblings[i].classList.remove('active');
  el.classList.add('active');
  document.getElementById('nm-category').value = val;
}

function setNoteRating(val) {
  document.getElementById('nm-rating').value = val;
  var stars = document.querySelectorAll('#nm-rating-stars .nm-star, .nm-stars .nm-star');
  var labels = ['','很差','较差','还行','推荐','力荐'];
  for(var i=0;i<stars.length;i++){
    if(i<val) stars[i].classList.add('active');
    else stars[i].classList.remove('active');
  }
  var textEl = document.getElementById('nm-rating-text');
  if(textEl) textEl.textContent = val>0 ? labels[val] : '点击评分';
}

function hoverNoteRating(val) {
  var stars = document.querySelectorAll('.nm-stars .nm-star');
  var labels = ['','很差','较差','还行','推荐','力荐'];
  var currentVal = parseInt(document.getElementById('nm-rating').value) || 0;
  var displayVal = val > 0 ? val : currentVal;
  for(var i=0;i<stars.length;i++){
    if(i<displayVal) stars[i].style.color = '#FFAC2D';
    else if(i<currentVal) stars[i].style.color = '#FFAC2D';
    else stars[i].style.color = '#e0e0e0';
  }
  // 临时文字
  var textEl = document.getElementById('nm-rating-text');
  if(textEl) {
    if(val > 0) textEl.textContent = labels[val];
    else if(currentVal > 0) textEl.textContent = labels[currentVal];
    else textEl.textContent = '点击评分';
  }
  // 移开时清除inline样式，恢复class控制
  if(val === 0) {
    for(var i=0;i<stars.length;i++) stars[i].style.color = '';
  }
}

function saveNote() {
  var title = document.getElementById('nm-title').value.trim();
  if(!title){ alert('请输入'+(noteModalType==='book'?'书名':'片名')); return; }

  var obj = {
    id: noteEditId || genId(),
    title: title,
    category: document.getElementById('nm-category').value,
    status: document.getElementById('nm-status').value,
    rating: parseInt(document.getElementById('nm-rating').value) || 0,
    startDate: document.getElementById('nm-startDate').value,
    finishDate: document.getElementById('nm-finishDate').value,
    notes: document.getElementById('nm-notes').value,
    createdAt: noteEditId ? '' : getTodayStr()
  };

  if(noteModalType==='book'){
    obj.author = document.getElementById('nm-author') ? document.getElementById('nm-author').value : '';
    if(!appData.bookNotes) appData.bookNotes = [];
    if(noteEditId){
      for(var i=0;i<appData.bookNotes.length;i++){
        if(appData.bookNotes[i].id===noteEditId){
          obj.createdAt = appData.bookNotes[i].createdAt;
          appData.bookNotes[i] = obj; break;
        }
      }
    } else {
      appData.bookNotes.push(obj);
    }
  } else {
    if(!appData.movieNotes) appData.movieNotes = [];
    if(noteEditId){
      for(var i=0;i<appData.movieNotes.length;i++){
        if(appData.movieNotes[i].id===noteEditId){
          obj.createdAt = appData.movieNotes[i].createdAt;
          appData.movieNotes[i] = obj; break;
        }
      }
    } else {
      appData.movieNotes.push(obj);
    }
  }

  saveData(appData);
  closeNoteModal();
  renderContent();
}

function deleteNote(type, id) {
  if(!confirm('确定删除此笔记？')) return;
  var key = type==='book' ? 'bookNotes' : 'movieNotes';
  var newArr = [];
  for(var i=0;i<appData[key].length;i++){
    if(appData[key][i].id!==id) newArr.push(appData[key][i]);
  }
  appData[key] = newArr;
  recordDeleted(id);
  saveData(appData);
  renderContent();
}

function recordDeleted(id) {
  if (!id) return;
  if (!appData.deletedIds) appData.deletedIds = [];
  if (appData.deletedIds.indexOf(id) < 0) appData.deletedIds.push(id);
  // 限制 deletedIds 长度，最多保留500条
  if (appData.deletedIds.length > 500) appData.deletedIds = appData.deletedIds.slice(-500);
}

/* ===== 电子时钟 ===== */
var clockMode = 'clock'; // 'clock' | 'countdown' | 'stopwatch'
var clockModes = ['clock','countdown','stopwatch'];
var clockModeLabels = { clock:'普通时钟', countdown:'倒计时', stopwatch:'正计时' };

// 倒计时状态
var countdownTotal = 0; // 总秒数
var countdownRemain = 0; // 剩余秒数
var countdownRunning = false;
var countdownTimer = null;
var countdownInputH = 0, countdownInputM = 5, countdownInputS = 0;

// 正计时状态
var stopwatchElapsed = 0; // 已过毫秒
var stopwatchRunning = false;
var stopwatchTimer = null;
var stopwatchStart = 0;

function switchClockMode() {
  var idx = clockModes.indexOf(clockMode);
  clockMode = clockModes[(idx+1)%clockModes.length];
  updateClockUI();
}

function updateClockUI() {
  document.getElementById('clock-mode-label').textContent = clockModeLabels[clockMode];
  var controls = document.getElementById('clock-controls');

  if(clockMode === 'clock') {
    controls.innerHTML = '';
  } else if(clockMode === 'countdown') {
    if(!countdownRunning && countdownRemain <= 0) {
      controls.innerHTML = '<div class="clock-toolbar">' +
        '<input class="clock-input" id="cd-h" type="number" min="0" max="23" value="'+countdownInputH+'"><span class="clock-input-label">时</span>' +
        '<input class="clock-input" id="cd-m" type="number" min="0" max="59" value="'+countdownInputM+'"><span class="clock-input-label">分</span>' +
        '<input class="clock-input" id="cd-s" type="number" min="0" max="59" value="'+countdownInputS+'"><span class="clock-input-label">秒</span>' +
        '<button class="clock-ctrl-btn" onclick="startCountdown()">开始</button>' +
        '</div>';
    } else {
      var pauseLabel = countdownRunning ? '暂停' : (countdownRemain > 0 ? '继续' : '重新');
      controls.innerHTML = '<div class="clock-toolbar"><button class="clock-ctrl-btn" onclick="pauseCountdown()">'+pauseLabel+'</button><button class="clock-ctrl-btn" onclick="resetCountdown()">重置</button></div>';
    }
  } else if(clockMode === 'stopwatch') {
    var startLabel = stopwatchRunning ? '暂停' : (stopwatchElapsed > 0 ? '继续' : '开始');
    controls.innerHTML = '<div class="clock-toolbar"><button class="clock-ctrl-btn" onclick="toggleStopwatch()">'+startLabel+'</button><button class="clock-ctrl-btn" onclick="resetStopwatch()">重置</button></div>';
  }
}

function startCountdown() {
  var h = parseInt(document.getElementById('cd-h').value) || 0;
  var m = parseInt(document.getElementById('cd-m').value) || 0;
  var s = parseInt(document.getElementById('cd-s').value) || 0;
  countdownInputH = h; countdownInputM = m; countdownInputS = s;
  countdownTotal = h*3600 + m*60 + s;
  if(countdownTotal <= 0) return;
  countdownRemain = countdownTotal;
  countdownRunning = true;
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(tickCountdown, 1000);
  updateClockUI();
}

function tickCountdown() {
  if(countdownRemain > 0) {
    countdownRemain--;
  }
  if(countdownRemain <= 0) {
    countdownRunning = false;
    clearInterval(countdownTimer);
    countdownTimer = null;
    // 闪炼提醒
    var disp = document.getElementById('clock-display');
    disp.style.color = '#ef4444';
    setTimeout(function(){ disp.style.color = ''; }, 3000);
  }
}

function pauseCountdown() {
  if(countdownRemain <= 0) { resetCountdown(); return; }
  countdownRunning = !countdownRunning;
  if(countdownRunning) {
    countdownTimer = setInterval(tickCountdown, 1000);
  } else {
    clearInterval(countdownTimer); countdownTimer = null;
  }
  updateClockUI();
}

function resetCountdown() {
  countdownRunning = false;
  countdownRemain = 0;
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  updateClockUI();
}

function toggleStopwatch() {
  if(stopwatchRunning) {
    stopwatchRunning = false;
    stopwatchElapsed += Date.now() - stopwatchStart;
    clearInterval(stopwatchTimer); stopwatchTimer = null;
  } else {
    stopwatchRunning = true;
    stopwatchStart = Date.now();
    stopwatchTimer = setInterval(tickStopwatch, 50);
  }
  updateClockUI();
}

function tickStopwatch() {
  // 渲染由clockLoop统一处理
}

function resetStopwatch() {
  stopwatchRunning = false;
  stopwatchElapsed = 0;
  if(stopwatchTimer){ clearInterval(stopwatchTimer); stopwatchTimer = null; }
  updateClockUI();
}

function formatTime(totalSec) {
  var h = Math.floor(totalSec/3600);
  var m = Math.floor((totalSec%3600)/60);
  var s = totalSec%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function formatMs(ms) {
  var totalSec = Math.floor(ms/1000);
  var h = Math.floor(totalSec/3600);
  var m = Math.floor((totalSec%3600)/60);
  var s = totalSec%60;
  var cent = Math.floor((ms%1000)/100);
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+cent;
}

function clockLoop() {
  var display = document.getElementById('clock-display');
  var dateEl = document.getElementById('clock-date');
  var now = new Date();

  if(clockMode === 'clock') {
    display.textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
    var weekDays2 = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    dateEl.textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 '+weekDays2[now.getDay()];
  } else if(clockMode === 'countdown') {
    var remain = countdownRemain;
    if(countdownRunning) {
      // 实时显示
    }
    display.textContent = formatTime(remain);
    var totalMin = Math.floor(countdownTotal/60);
    dateEl.textContent = '总计 '+formatTime(countdownTotal);
  } else if(clockMode === 'stopwatch') {
    var elapsed = stopwatchElapsed;
    if(stopwatchRunning) elapsed += Date.now() - stopwatchStart;
    display.textContent = formatMs(elapsed);
    dateEl.textContent = '正计时';
  }
}

/* ===== 每日自动重置 ===== */
function checkDailyReset() {
  var today = getTodayStr();
  if(appData.lastResetDate !== today) {
    // 新的一天：日常任务全部恢复为未完成
    for(var i=0;i<appData.daily.length;i++){
      appData.daily[i].completed = false;
    }
    // 清理过期的月度完成记录（只保留今天的）
    var newMC = {};
    for(var key in appData.monthlyCompleted){
      if(key.indexOf(today+'_') === 0) newMC[key] = appData.monthlyCompleted[key];
    }
    appData.monthlyCompleted = newMC;
    appData.lastResetDate = today;
    saveData(appData);
  }
}

/* ===== 导出模式：供 PowerShell 邮件脚本读取未完成任务 ===== */
function getUncompletedTasks() {
  var today = getTodayStr();
  var result = [];
  // 日常任务
  for(var i=0;i<appData.daily.length;i++){
    if(!appData.daily[i].completed){
      result.push({
        title: appData.daily[i].title,
        priority: appData.daily[i].priority,
        category: appData.daily[i].category,
        source: 'daily'
      });
    }
  }
  // 临时任务
  for(var i=0;i<appData.tempTasks.length;i++){
    if(!appData.tempTasks[i].completed){
      result.push({
        title: appData.tempTasks[i].title,
        priority: appData.tempTasks[i].priority,
        deadline: appData.tempTasks[i].tempDeadline || '',
        source: 'temp'
      });
    }
  }
  // 今日月度到期任务
  var now = new Date();
  var day = now.getDate();
  var month = now.getMonth()+1;
  for(var i=0;i<appData.midterm.length;i++){
    var item = appData.midterm[i];
    if(item.cycleDay === day){
      var isThisMonth = true;
      if(item.cycleMonths && item.cycleMonths.length){
        isThisMonth = item.cycleMonths.indexOf(month) >= 0;
      }
      if(isThisMonth){
        var key = today+'_'+item.id;
        if(!appData.monthlyCompleted[key]){
          result.push({
            title: item.title,
            priority: item.priority,
            cycleLabel: item.cycleLabel || '',
            source: 'monthly'
          });
        }
      }
    }
  }
  return result;
}

/* ===== 初始化 ===== */
function init() {
  checkDailyReset();
  var now = new Date();
  var weekDays = ['日','一','二','三','四','五','六'];
  document.getElementById('sidebar-date').textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 星期'+weekDays[now.getDay()];
  initCalendar();
  renderContent();
  updateClockUI();
  clockLoop();
  setInterval(clockLoop, 100); // 100ms刷新
  // 每分钟检查一次是否跨日（长时间不关页面时）
  setInterval(function(){
    var today = getTodayStr();
    if(appData.lastResetDate !== today){
      checkDailyReset();
      renderContent();
      renderCalendar();
    }
  }, 60000);
  // 云端同步初始化
  initCloudSync();
}

/* ===== 启动：导出模式 vs 正常模式 ===== */
var urlSearch = window.location.search;
if(urlSearch.indexOf('export=1') >= 0) {
  // 导出模式：输出未完成任务JSON
  checkDailyReset();
  var uncompleted = getUncompletedTasks();
  var exportData = { date: getTodayStr(), time: new Date().toLocaleString('zh-CN'), uncompleted: uncompleted, count: uncompleted.length };
  document.title = 'Export';
  document.body.innerHTML = '<pre id="export-data">'+JSON.stringify(exportData)+'</pre>';
  document.body.style.cssText = 'margin:0;padding:0;font-family:monospace;';
} else {
  init();
}
