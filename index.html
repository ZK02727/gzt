<style>

* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"寰蒋闆呴粦","Microsoft YaHei",sans-serif; font-size:14px; color:#333; background:#f0f2f5; height:100vh; overflow:hidden; display:flex; }

/* ===== 宸︿晶瀵艰埅鏍?===== */
.sidebar { width:240px; min-width:240px; background:#1e2a3a; color:#fff; display:flex; flex-direction:column; height:100vh; }
.sidebar-title { padding:24px 20px 8px; font-size:20px; font-weight:700; letter-spacing:1px; }
.sidebar-subtitle { padding:0 20px 20px; font-size:12px; color:#8eaadb; }
.nav-list { flex:1; }
.nav-item { display:flex; align-items:center; padding:14px 20px; cursor:pointer; transition:background .2s; position:relative; }
.nav-item:hover { background:#263548; }
.nav-item.active { background:#2b5797; }
.nav-icon { font-size:18px; margin-right:12px; width:24px; text-align:center; }
.nav-label { flex:1; font-size:15px; }
.nav-badge { background:#e74c3c; color:#fff; font-size:11px; border-radius:10px; padding:2px 8px; min-width:20px; text-align:center; }
.sidebar-footer { padding:16px 20px; font-size:12px; color:#6b8aaa; border-top:1px solid #263548; }

/* ===== 鍙充晶鍐呭鍖?===== */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.main-header { padding:16px 32px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #e0e0e0; background:#fff; }
.main-header h2 { font-size:22px; color:#1e2a3a; }
.main-stats { display:flex; gap:20px; font-size:13px; color:#666; margin-top:4px; }
.main-stats span span { font-weight:700; color:#2b5797; }

/* ===== 椤堕儴闈㈡澘锛堟棩鍘?鏃堕挓锛?===== */
.top-panel { background:#fff; border-bottom:1px solid #e0e0e0; }
.top-panel-inner { display:flex; gap:16px; padding:12px 32px; }

/* ===== 鏈堝巻 ===== */
.calendar-section { flex:1; min-width:0; }
.calendar-nav { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.calendar-nav-btn { background:none; border:1px solid #ddd; border-radius:4px; padding:2px 8px; cursor:pointer; font-size:12px; }
.calendar-nav-btn:hover { background:#f5f5f5; }
.calendar-month { font-size:14px; font-weight:600; color:#1e2a3a; }
.calendar-toggle { background:none; border:none; cursor:pointer; font-size:13px; color:#999; transition:transform .2s; padding:2px 6px; border-radius:4px; }
.calendar-toggle:hover { color:#2b5797; background:#f0f2f5; }
.calendar-toggle.collapsed { transform:rotate(-90deg); }
.calendar-legend { display:flex; gap:12px; margin-left:auto; font-size:10px; color:#999; }
.legend-item { display:flex; align-items:center; gap:3px; }
.legend-dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
.legend-dot.dot-month { background:#8e44ad; }
.legend-dot.dot-temp { background:#e74c3c; }
.legend-dot.dot-special { background:#f39c12; }
.calendar-body { overflow:hidden; transition:max-height .3s ease, opacity .3s ease; max-height:400px; opacity:1; }
.calendar-body.collapsed { max-height:0; opacity:0; }
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; }
.cal-weekday { text-align:center; font-size:11px; color:#999; padding:2px 0; font-weight:500; }
.cal-day { text-align:center; padding:3px 0; border-radius:4px; font-size:12px; cursor:pointer; position:relative; transition:background .15s; }
.cal-day:hover { background:#f0f2f5; }
.cal-day.other-month { color:#ccc; }
.cal-day.today { background:#2b5797; color:#fff; font-weight:700; }
.cal-day.today:hover { background:#1e3a6e; }
.cal-day.has-month, .cal-day.has-temp, .cal-day.has-special { font-weight:600; }
.cal-day.has-month { color:#8e44ad; }
.cal-day.has-temp { color:#e74c3c; }
.cal-day.has-special { color:#f39c12; }
.cal-day.today.has-month, .cal-day.today.has-temp, .cal-day.today.has-special { color:#fff; }
.cal-dots { display:flex; justify-content:center; gap:1px; margin-top:1px; height:5px; }
.cal-dot-indicator { width:4px; height:4px; border-radius:50%; }
.cal-dot-indicator.dot-month { background:#8e44ad; }
.cal-dot-indicator.dot-temp { background:#e74c3c; }
.cal-dot-indicator.dot-special { background:#f39c12; }
.cal-day.today .cal-dot-indicator { background:#fff !important; }

/* ===== 浠婃棩寰呭姙涓ゅ垪甯冨眬 ===== */
.daily-columns { display:flex; gap:20px; }
.daily-col { flex:1; min-width:0; }
.daily-col-header { display:flex; align-items:center; justify-content:space-between; padding:8px 0 12px; border-bottom:2px solid #e0e0e0; margin-bottom:12px; }
.daily-col-title { font-size:16px; font-weight:600; color:#1e2a3a; display:flex; align-items:center; gap:6px; }
.daily-col-count { font-size:12px; color:#999; font-weight:400; }
.btn-add-sm { background:#2b5797; color:#fff; border:none; padding:5px 14px; border-radius:5px; cursor:pointer; font-size:12px; transition:background .2s; }
.btn-add-sm:hover { background:#1e3a6e; }

/* 鍒嗙被鍒嗙粍 */
.category-group { margin-bottom:16px; }
.category-header { display:flex; align-items:center; padding:4px 0 8px; border-bottom:1px solid #f0f0f0; margin-bottom:8px; }
.category-icon { font-size:15px; margin-right:6px; }
.category-name { font-size:14px; font-weight:600; color:#1e2a3a; flex:1; }
.category-count { font-size:11px; color:#999; }

/* 宸插畬鎴愭姌鍙犵粍 */
.completed-group { margin-top:8px; padding-top:6px; border-top:1px dashed #e8e8e8; }
.completed-toggle { user-select:none; }
.completed-toggle:hover { color:#666 !important; }

/* 浠诲姟鍗＄墖 */
.content-area { flex:1; overflow-y:auto; padding:20px 32px; }
.task-card { background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:8px; transition:box-shadow .2s; border-left:4px solid #2b5797; }
.task-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.12); }
.task-card.priority-urgent { border-left-color:#e74c3c; }
.task-card.priority-important { border-left-color:#f39c12; }
.task-card.priority-routine { border-left-color:#3498db; }
.task-card.completed { opacity:.5; }
.task-card.completed .task-title { text-decoration:line-through; }
.task-card.from-monthly { border-left-color:#8e44ad; background:#faf8fc; }
.task-card.from-temp { border-left-color:#e67e22; background:#fef9f4; }

.task-header { display:flex; align-items:center; padding:10px 14px; cursor:pointer; }
.task-checkbox { width:18px; height:18px; border-radius:50%; border:2px solid #ccc; margin-right:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; flex-shrink:0; }
.task-checkbox:hover { border-color:#2b5797; }
.task-checkbox.checked { background:#27ae60; border-color:#27ae60; }
.task-checkbox.checked::after { content:"\2713"; color:#fff; font-size:11px; }
.task-title { flex:1; font-size:14px; font-weight:500; }
.task-meta { display:flex; align-items:center; gap:8px; margin-left:auto; }
.priority-tag { font-size:10px; padding:2px 6px; border-radius:4px; color:#fff; }
.priority-tag.urgent { background:#e74c3c; }
.priority-tag.important { background:#f39c12; }
.priority-tag.routine { background:#3498db; }
.status-tag { font-size:10px; padding:2px 6px; border-radius:4px; }
.status-tag.wait { background:#ecf0f1; color:#95a5a6; }
.status-tag.progress { background:#e8f0fe; color:#2b5797; }
.status-tag.review { background:#fef5e7; color:#f39c12; }
.status-tag.done { background:#eafaf1; color:#27ae60; }
.cycle-tag { font-size:10px; padding:2px 6px; border-radius:4px; background:#e8e0f0; color:#8e44ad; white-space:nowrap; }
.source-tag { font-size:10px; padding:2px 6px; border-radius:4px; white-space:nowrap; }
.source-tag.monthly { background:#e8e0f0; color:#8e44ad; }
.source-tag.temp { background:#fde8d0; color:#e67e22; }
.task-expand { margin-left:4px; color:#999; transition:transform .2s; font-size:11px; }
.task-expand.open { transform:rotate(180deg); }

/* 灞曞紑璇︽儏 */
.task-detail { display:none; padding:0 14px 14px; border-top:1px solid #f0f0f0; }
.task-detail.show { display:block; }
.detail-section { margin-top:10px; }
.detail-label { font-size:12px; color:#999; margin-bottom:3px; }
.meditation-track-info { display:flex; justify-content:space-between; align-items:center; }
.meditation-track-name { font-size:13px; font-weight:600; color:#2b5797; }
.meditation-track-dur { font-size:12px; color:#999; background:#f0f0f0; padding:2px 8px; border-radius:10px; }
.meditation-tracks audio { border-radius:6px; }
.detail-text { font-size:13px; line-height:1.5; color:#555; }
.detail-progress { margin-top:6px; }
.progress-bar { height:6px; background:#e0e0e0; border-radius:3px; overflow:hidden; }
.progress-fill { height:100%; background:#2b5797; border-radius:3px; transition:width .3s; }
.progress-text { font-size:11px; color:#999; margin-top:3px; }

/* AI杈呭姪鍖?*/
.ai-assist { margin-top:12px; background:#f8f9fb; border-radius:6px; padding:12px; border:1px dashed #8eaadb; }
.ai-assist-title { font-size:12px; color:#2b5797; font-weight:600; margin-bottom:4px; }
.ai-assist-content { font-size:12px; color:#666; line-height:1.5; min-height:20px; white-space:pre-wrap; }
.ai-assist-empty { color:#bbb; font-style:italic; }

/* 閲岀▼纰戝垪琛?*/
.milestone-list { list-style:none; margin-top:6px; }
.milestone-item { display:flex; align-items:center; padding:3px 0; font-size:12px; }
.milestone-check { width:14px; height:14px; border:1.5px solid #ccc; border-radius:3px; margin-right:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.milestone-check.checked { background:#27ae60; border-color:#27ae60; }
.milestone-check.checked::after { content:"\2713"; color:#fff; font-size:9px; }

/* OKR鍏抽敭缁撴灉 */
.kr-list { margin-top:8px; }
.kr-item { background:#fff; border:1px solid #eee; border-radius:6px; padding:10px; margin-bottom:8px; }
.kr-title { font-size:13px; font-weight:500; margin-bottom:6px; }

/* 鎿嶄綔鎸夐挳 */
.task-actions { margin-top:10px; display:flex; gap:6px; }
.btn-sm { padding:4px 10px; border-radius:4px; border:1px solid #ddd; background:#fff; cursor:pointer; font-size:11px; transition:all .2s; }
.btn-sm:hover { background:#f5f5f5; }
.btn-sm.btn-danger { color:#e74c3c; border-color:#e74c3c; }
.btn-sm.btn-danger:hover { background:#e74c3c; color:#fff; }

/* 妯℃€佹 */
.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.4); z-index:1000; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal-box { background:#fff; border-radius:10px; width:480px; max-height:80vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,.15); }
.modal-header { padding:16px 24px; border-bottom:1px solid #eee; display:flex; align-items:center; justify-content:space-between; }
.modal-header h3 { font-size:17px; }
.modal-close { background:none; border:none; font-size:20px; cursor:pointer; color:#999; }
.modal-close:hover { color:#333; }
.modal-body { padding:20px 24px; }
.form-group { margin-bottom:12px; }
.form-group label { display:block; font-size:13px; color:#666; margin-bottom:3px; }
.form-group input,.form-group select,.form-group textarea { width:100%; padding:7px 10px; border:1px solid #ddd; border-radius:6px; font-size:14px; font-family:inherit; }
.form-group textarea { min-height:70px; resize:vertical; }
.modal-footer { padding:12px 24px; border-top:1px solid #eee; display:flex; justify-content:flex-end; gap:10px; }
.btn-cancel { padding:7px 16px; border:1px solid #ddd; border-radius:6px; background:#fff; cursor:pointer; }
.btn-confirm { padding:7px 16px; border:none; border-radius:6px; background:#2b5797; color:#fff; cursor:pointer; }
.btn-confirm:hover { background:#1e3a6e; }

/* 纭寮圭獥 */
.confirm-box { width:360px; text-align:center; }
.confirm-box .modal-body { font-size:15px; padding:24px; }

/* 绌虹姸鎬?*/
.empty-state { text-align:center; padding:40px 20px; color:#bbb; }
.empty-state .empty-icon { font-size:40px; margin-bottom:8px; }
.empty-state p { font-size:14px; }

/* 杩囨浮鍔ㄧ敾 */
.fade-in { animation:fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* 婊氬姩鏉?*/
.content-area::-webkit-scrollbar { width:6px; }
.content-area::-webkit-scrollbar-thumb { background:#ccc; border-radius:3px; }
.content-area::-webkit-scrollbar-thumb:hover { background:#aaa; }

/* ===== 鐢靛瓙鏃堕挓 ===== */
.clock-section { width:320px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 0; }
.clock-row { display:flex; align-items:center; gap:12px; }
.clock-display { font-family:'Courier New','Consolas',monospace; font-size:36px; font-weight:700; color:#1e2a3a; letter-spacing:2px; line-height:1.1; text-align:center; }
.clock-right { display:flex; flex-direction:column; align-items:flex-start; gap:3px; }
.clock-date { font-size:11px; color:#999; white-space:nowrap; }
.clock-mode-label { font-size:11px; color:#2b5797; cursor:pointer; padding:1px 8px; border:1px solid #8eaadb; border-radius:10px; transition:all .2s; user-select:none; white-space:nowrap; }
.clock-mode-label:hover { background:#2b5797; color:#fff; border-color:#2b5797; }
.clock-toolbar { display:flex; align-items:center; gap:6px; margin-top:4px; flex-wrap:wrap; justify-content:center; }
.clock-ctrl-btn { background:none; border:1px solid #ddd; border-radius:4px; padding:2px 10px; cursor:pointer; font-size:11px; transition:all .2s; white-space:nowrap; }
.clock-ctrl-btn:hover { background:#2b5797; color:#fff; border-color:#2b5797; }
.clock-input { width:42px; padding:2px 4px; border:1px solid #ddd; border-radius:4px; font-size:12px; text-align:center; font-family:'Courier New',monospace; }
.clock-input-label { font-size:10px; color:#999; }
</style>

/* 鏅鸿兘鍚堝苟锛氬皢鏈湴鏁版嵁涓庝簯绔暟鎹瓧娈电骇鍚堝苟锛岀‘淇濅笉涓㈠け浠讳綍绔殑鏁版嵁 */
function mergeData(local, cloud) {
  if (!cloud || !cloud.daily) return local;
  if (!local || !local.daily) return cloud;

  var merged = JSON.parse(JSON.stringify(local)); // 浠ユ湰鍦颁负鍩哄簳

  // --- 鍚堝苟 daily 浠诲姟锛堜互id涓簁ey锛?--
  var cloudDailyMap = {};
  for (var i = 0; i < cloud.daily.length; i++) cloudDailyMap[cloud.daily[i].id] = cloud.daily[i];

  // 璺ㄦ棩閲嶇疆鍒ゆ柇锛氬鏋滄湰鍦板凡閲嶇疆鍒版柊鏃ユ湡锛屼簯绔殑瀹屾垚鐘舵€佷笉搴?澶嶆椿"
  var localResetDate = local.lastResetDate || '';
  var cloudResetDate = cloud.lastResetDate || '';
  var sameDay = localResetDate === cloudResetDate && localResetDate !== '';

  for (var i = 0; i < merged.daily.length; i++) {
    var item = merged.daily[i];
    var cloudItem = cloudDailyMap[item.id];
    if (cloudItem) {
      // 瀹屾垚鐘舵€佸悎骞讹細鍙湁鍚屼竴鏃ユ湡鍐呮墠鍚堝苟瀹屾垚鐘舵€侊紙闃叉璺ㄦ棩閲嶇疆琚簯绔棫鐘舵€佽鐩栵級
      if (sameDay && cloudItem.completed && !item.completed) item.completed = true;
      // aiAssist锛氫簯绔湁鍊间笖鏈湴涓虹┖鈫掍繚鐣欎簯绔紱鏈湴鏈夊€尖啋淇濈暀鏈湴
      if (cloudItem.aiAssist && !item.aiAssist) item.aiAssist = cloudItem.aiAssist;
      // desc/priority锛氫簯绔彲鑳借鍙︿竴璁惧淇敼杩囷紝鏈湴浼樺厛锛堢敤鎴锋渶鏂版搷浣滐級
      // createdAt绛夊厓鏁版嵁淇濈暀鏈湴
    }
  }

  // 浜戠鏈変絾鏈湴娌℃湁鐨勪换鍔★紙鍙︿竴璁惧鏂版坊鍔犵殑锛夆啋 杩藉姞鍒版湰鍦?  var localDailyIds = {};
  for (var i = 0; i < merged.daily.length; i++) localDailyIds[merged.daily[i].id] = true;
  for (var id in cloudDailyMap) {
    if (!localDailyIds[id]) merged.daily.push(cloudDailyMap[id]);
  }

  // --- 鍚堝苟 tempTasks锛堜互id涓簁ey锛?--
  var cloudTempMap = {};
  for (var i = 0; i < (cloud.tempTasks||[]).length; i++) cloudTempMap[cloud.tempTasks[i].id] = cloud.tempTasks[i];
  for (var i = 0; i < (merged.tempTasks||[]).length; i++) {
    var t = merged.tempTasks[i];
    var ct = cloudTempMap[t.id];
    if (ct) {
      if (ct.completed && !t.completed) t.completed = true;
    }
  }
  var localTempIds = {};
  for (var i = 0; i < (merged.tempTasks||[]).length; i++) localTempIds[merged.tempTasks[i].id] = true;
  for (var id in cloudTempMap) {
    if (!localTempIds[id]) (merged.tempTasks||(merged.tempTasks=[])).push(cloudTempMap[id]);
  }

  // --- 鍚堝苟 midterm锛堟湀搴﹀懆鏈熶换鍔★紝浠d涓簁ey锛?--
  var cloudMidMap = {};
  for (var i = 0; i < (cloud.midterm||[]).length; i++) cloudMidMap[cloud.midterm[i].id] = cloud.midterm[i];
  for (var i = 0; i < (merged.midterm||[]).length; i++) {
    var m = merged.midterm[i];
    var cm = cloudMidMap[m.id];
    if (cm) {
      if (cm.status === 'done' && m.status !== 'done') m.status = 'done';
    }
  }
  var localMidIds = {};
  for (var i = 0; i < (merged.midterm||[]).length; i++) localMidIds[merged.midterm[i].id] = true;
  for (var id in cloudMidMap) {
    if (!localMidIds[id]) (merged.midterm||(merged.midterm=[])).push(cloudMidMap[id]);
  }

  // --- 鍚堝苟 longterm锛堥暱鏈熶簨椤癸紝浠d涓簁ey锛?--
  var cloudLtMap = {};
  for (var i = 0; i < (cloud.longterm||[]).length; i++) cloudLtMap[cloud.longterm[i].id] = cloud.longterm[i];
  for (var id in cloudLtMap) {
    var found = false;
    for (var i = 0; i < (merged.longterm||[]).length; i++) {
      if (merged.longterm[i].id === id) { found = true; break; }
    }
    if (!found) (merged.longterm||(merged.longterm=[])).push(cloudLtMap[id]);
  }

  // --- 鍚堝苟 monthlyCompleted锛堟湀搴︿换鍔″畬鎴愯褰曪紝骞堕泦锛?--
  if (cloud.monthlyCompleted) {
    merged.monthlyCompleted = merged.monthlyCompleted || {};
    for (var key in cloud.monthlyCompleted) {
      if (!merged.monthlyCompleted[key]) merged.monthlyCompleted[key] = cloud.monthlyCompleted[key];
    }
  }

  // --- lastResetDate锛氬彇杈冩柊鐨勬棩鏈?---
  if (cloud.lastResetDate && cloud.lastResetDate > (merged.lastResetDate || '')) {
    merged.lastResetDate = cloud.lastResetDate;
  }

  // --- 鏃堕棿鎴筹細鍙栬緝鏂拌€咃紝鍐嶆洿鏂颁负褰撳墠鏃堕棿 ---
  var now = new Date().toISOString();
  var cloudTime = cloud._lastModified || '';
  var localTime = local._lastModified || '';
  merged._lastModified = now;

  return merged;
}

/* syncToGist: 鎺ㄩ€佸墠鍏堟媺鍙栦簯绔暟鎹紝鏅鸿兘鍚堝苟鍚庡啀鎺ㄩ€侊紙鏍规不鏁版嵁瑕嗙洊闂锛?*/
function syncToGist(data) {
  var token = getGitHubToken();
  if (!token) {
    updateSyncStatus('cloud-no-token');
    return;
  }
  if (cloudSyncing) return; // 闃叉骞跺彂
  cloudSyncing = true;

  // 姝ラ1锛氬厛鎷夊彇浜戠鏈€鏂版暟鎹?  loadFromGist(function(cloudData, err) {
    if (cloudData && cloudData.daily) {
      // 姝ラ2锛氭櫤鑳藉悎骞舵湰鍦颁笌浜戠
      var merged = mergeData(data, cloudData);
      // 鏇存柊鏈湴appData涓哄悎骞剁粨鏋滐紙杩欐牱鏈湴涔熸湁浜戠鐨勬柊鏁版嵁锛?      appData = merged;
      localStorage.setItem(LS_CACHE_KEY, JSON.stringify(appData));
      // 姝ラ3锛氭帹閫佸悎骞跺悗鐨勬暟鎹?      _doGistPush(merged);
    } else {
      // 浜戠鎷夊彇澶辫触鈫掍笉鎺ㄤ簡锛岄伩鍏嶇敤鏈湴鏁版嵁鐩茶鐩?      cloudSyncing = false;
      updateSyncStatus('cloud-error');
      console.log('syncToGist: 浜戠鎷夊彇澶辫触锛屾斁寮冩帹閫佷互閬垮厤瑕嗙洊');
    }
  });
}

/* 瀹為檯鎵цGist PATCH鎺ㄩ€?*/
function _doGistPush(data) {
  var token = getGitHubToken();
  var payload = {
    description: 'GZT Workbench Data',
    files: {}
  };
  payload.files[GIST_FILENAME] = {
    content: JSON.stringify(data, null, 2)
  };
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('PATCH', GIST_API, true);
    xhr.setRequestHeader('Authorization', 'token ' + token);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        cloudSyncing = false;
        if (xhr.status >= 200 && xhr.status < 300) {
          lastCloudSync = new Date();
          updateSyncStatus('cloud-ok');
        } else {
          updateSyncStatus('cloud-error');
          console.log('Gist sync error:', xhr.status, xhr.responseText);
        }
      }
    };
    xhr.send(JSON.stringify(payload));
  } catch(e) {
    cloudSyncing = false;
    updateSyncStatus('cloud-error');
  }
}

function loadFromGist(callback) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', GIST_API, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var gist = JSON.parse(xhr.responseText);
          var content = gist.files[GIST_FILENAME].content;
          var cloudData = JSON.parse(content);
          callback(cloudData, null);
        } catch(e) {
          callback(null, '瑙ｆ瀽澶辫触');
        }
      } else {
        callback(null, 'HTTP ' + xhr.status);
      }
    }
  };
  xhr.send();
}

/* ===== 鏈堝巻 ===== */
function initCalendar() {
  var now = new Date();
  calYear = now.getFullYear();
  calMonth = now.getMonth();
  renderCalendar();
}

function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }
function calToday() { var now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth(); renderCalendar(); }

function renderCalendar() {
  document.getElementById('cal-month-label').textContent = calYear+'骞?+(calMonth+1)+'鏈?;
  var grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  // 鏄熸湡鏍囬
  var weekLabels = ['涓€','浜?,'涓?,'鍥?,'浜?,'鍏?,'鏃?];
  for(var w=0;w<7;w++){
    var wd = document.createElement('div');
    wd.className = 'cal-weekday';
    wd.textContent = weekLabels[w];
    grid.appendChild(wd);
  }

  var firstDay = new Date(calYear, calMonth, 1);
  var startWeekday = firstDay.getDay(); // 0=鏃?  startWeekday = startWeekday === 0 ? 6 : startWeekday - 1; // 杞负0=涓€
  var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  var prevDays = new Date(calYear, calMonth, 0).getDate();

  var today = new Date();
  var todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();

  // 鑾峰彇鏈湀鏈夋湀搴﹀緟鍔炵殑鏃ユ湡
  var monthlyDays = getMonthlyTaskDays(calYear, calMonth+1);
  // 鑾峰彇涓存椂浠诲姟鎴鏃?  var tempDeadlineDays = getTempDeadlineDays(calYear, calMonth+1);

  // 涓婃湀濉厖
  for(var i=startWeekday-1;i>=0;i--){
    var d = document.createElement('div');
    d.className = 'cal-day other-month';
    d.innerHTML = '<div>'+(prevDays-i)+'</div><div class="cal-dots"></div>';
    grid.appendChild(d);
  }

  // 鏈湀
  for(var day=1;day<=daysInMonth;day++){
    var d = document.createElement('div');
    var isToday = (calYear===todayY && calMonth===todayM && day===todayD);
    var classes = ['cal-day'];
    if(isToday) classes.push('today');

    var dotHtml = '<div class="cal-dots">';
    if(monthlyDays.indexOf(day)>=0){ classes.push('has-month'); dotHtml+='<span class="cal-dot-indicator dot-month"></span>'; }
    if(tempDeadlineDays.indexOf(day)>=0){ classes.push('has-temp'); dotHtml+='<span class="cal-dot-indicator dot-temp"></span>'; }
    var specialKey = (calMonth+1)+'-'+day;
    if(SPECIAL_DATES[specialKey]){ classes.push('has-special'); dotHtml+='<span class="cal-dot-indicator dot-special"></span>'; }
    dotHtml += '</div>';

    d.className = classes.join(' ');
    d.innerHTML = '<div>'+day+'</div>'+dotHtml;
    grid.appendChild(d);
  }

  // 涓嬫湀濉厖锛堣ˉ婊?琛岋級
  var totalCells = startWeekday + daysInMonth;
  var remaining = (7 - totalCells%7)%7;
  for(var i=1;i<=remaining;i++){
    var d = document.createElement('div');
    d.className = 'cal-day other-month';
    d.innerHTML = '<div>'+i+'</div><div class="cal-dots"></div>';
    grid.appendChild(d);
  }
}

function getMonthlyTaskDays(year, month) {
  var days = [];
  for(var i=0;i<appData.midterm.length;i++){
    var item = appData.midterm[i];
    if(item.cycleMonths && item.cycleMonths.length){
      // 瀛ｅ害浠诲姟
      for(var j=0;j<item.cycleMonths.length;j++){
        if(item.cycleMonths[j]===month && item.cycleDay) days.push(item.cycleDay);
      }
    } else if(item.cycleDay){
      days.push(item.cycleDay);
    }
  }
  // 鍘婚噸
  var unique = [];
  for(var i=0;i<days.length;i++){ if(unique.indexOf(days[i])<0) unique.push(days[i]); }
  unique.sort(function(a,b){return a-b;});
  return unique;
}

function getTempDeadlineDays(year, month) {
  var days = [];
  for(var i=0;i<appData.tempTasks.length;i++){
    var t = appData.tempTasks[i];
    if(t.tempDeadline){
      var parts = t.tempDeadline.split('-');
      if(parseInt(parts[0])===year && parseInt(parts[1])===month){
        days.push(parseInt(parts[2]));
      }
    }
  }
  var unique = [];
  for(var i=0;i<days.length;i++){ if(unique.indexOf(days[i])<0) unique.push(days[i]); }
  unique.sort(function(a,b){return a-b;});
  return unique;
}

/* ===== 鍒ゆ柇鏈堝害浠诲姟浠婂ぉ鏄惁瑙﹀彂 ===== */
function getTodayMonthlyItems() {
  var today = new Date();
  var day = today.getDate();
  var month = today.getMonth()+1;
  var result = [];
  for(var i=0;i<appData.midterm.length;i++){
    var item = appData.midterm[i];
    if(item.cycleDay === day){
      if(item.cycleMonths && item.cycleMonths.length){
        if(item.cycleMonths.indexOf(month)>=0) result.push(item);
      } else {
        result.push(item);
      }
    }
  }
  return result;
}

/* ===== 鐢靛瓙鏃堕挓 ===== */
var clockMode = 'clock'; // 'clock' | 'countdown' | 'stopwatch'
var clockModes = ['clock','countdown','stopwatch'];
var clockModeLabels = { clock:'鏅€氭椂閽?, countdown:'鍊掕鏃?, stopwatch:'姝ｈ鏃? };

// 鍊掕鏃剁姸鎬?var countdownTotal = 0; // 鎬荤鏁?var countdownRemain = 0; // 鍓╀綑绉掓暟
var countdownRunning = false;
var countdownTimer = null;
var countdownInputH = 0, countdownInputM = 5, countdownInputS = 0;

// 姝ｈ鏃剁姸鎬?var stopwatchElapsed = 0; // 宸茶繃姣
var stopwatchRunning = false;
var stopwatchTimer = null;
var stopwatchStart = 0;

function switchClockMode() {
  var idx = clockModes.indexOf(clockMode);
  clockMode = clockModes[(idx+1)%clockModes.length];
  updateClockUI();
}

function updateClockUI() {
  document.getElementById('clock-mode-label').textContent = clockModeLabels[clockMode];
  var controls = document.getElementById('clock-controls');

  if(clockMode === 'clock') {
    controls.innerHTML = '';
  } else if(clockMode === 'countdown') {
    if(!countdownRunning && countdownRemain <= 0) {
      controls.innerHTML = '<div class="clock-toolbar">' +
        '<input class="clock-input" id="cd-h" type="number" min="0" max="23" value="'+countdownInputH+'"><span class="clock-input-label">鏃?/span>' +
        '<input class="clock-input" id="cd-m" type="number" min="0" max="59" value="'+countdownInputM+'"><span class="clock-input-label">鍒?/span>' +
        '<input class="clock-input" id="cd-s" type="number" min="0" max="59" value="'+countdownInputS+'"><span class="clock-input-label">绉?/span>' +
        '<button class="clock-ctrl-btn" onclick="startCountdown()">寮€濮?/button>' +
        '</div>';
    } else {
      var pauseLabel = countdownRunning ? '鏆傚仠' : (countdownRemain > 0 ? '缁х画' : '閲嶆柊');
      controls.innerHTML = '<div class="clock-toolbar"><button class="clock-ctrl-btn" onclick="pauseCountdown()">'+pauseLabel+'</button><button class="clock-ctrl-btn" onclick="resetCountdown()">閲嶇疆</button></div>';
    }
  } else if(clockMode === 'stopwatch') {
    var startLabel = stopwatchRunning ? '鏆傚仠' : (stopwatchElapsed > 0 ? '缁х画' : '寮€濮?);
    controls.innerHTML = '<div class="clock-toolbar"><button class="clock-ctrl-btn" onclick="toggleStopwatch()">'+startLabel+'</button><button class="clock-ctrl-btn" onclick="resetStopwatch()">閲嶇疆</button></div>';
  }
}

function startCountdown() {
  var h = parseInt(document.getElementById('cd-h').value) || 0;
  var m = parseInt(document.getElementById('cd-m').value) || 0;
  var s = parseInt(document.getElementById('cd-s').value) || 0;
  countdownInputH = h; countdownInputM = m; countdownInputS = s;
  countdownTotal = h*3600 + m*60 + s;
  if(countdownTotal <= 0) return;
  countdownRemain = countdownTotal;
  countdownRunning = true;
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(tickCountdown, 1000);
  updateClockUI();
}

function tickCountdown() {
  if(countdownRemain > 0) {
    countdownRemain--;
  }
  if(countdownRemain <= 0) {
    countdownRunning = false;
    clearInterval(countdownTimer);
    countdownTimer = null;
    // 闂偧鎻愰啋
    var disp = document.getElementById('clock-display');
    disp.style.color = '#e74c3c';
    setTimeout(function(){ disp.style.color = ''; }, 3000);
  }
}

function pauseCountdown() {
  if(countdownRemain <= 0) { resetCountdown(); return; }
  countdownRunning = !countdownRunning;
  if(countdownRunning) {
    countdownTimer = setInterval(tickCountdown, 1000);
  } else {
    clearInterval(countdownTimer); countdownTimer = null;
  }
  updateClockUI();
}

function resetCountdown() {
  countdownRunning = false;
  countdownRemain = 0;
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  updateClockUI();
}

function toggleStopwatch() {
  if(stopwatchRunning) {
    stopwatchRunning = false;
    stopwatchElapsed += Date.now() - stopwatchStart;
    clearInterval(stopwatchTimer); stopwatchTimer = null;
  } else {
    stopwatchRunning = true;
    stopwatchStart = Date.now();
    stopwatchTimer = setInterval(tickStopwatch, 50);
  }
  updateClockUI();
}

function tickStopwatch() {
  // 娓叉煋鐢眂lockLoop缁熶竴澶勭悊
}

function resetStopwatch() {
  stopwatchRunning = false;
  stopwatchElapsed = 0;
  if(stopwatchTimer){ clearInterval(stopwatchTimer); stopwatchTimer = null; }
  updateClockUI();
}

function formatTime(totalSec) {
  var h = Math.floor(totalSec/3600);
  var m = Math.floor((totalSec%3600)/60);
  var s = totalSec%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function formatMs(ms) {
  var totalSec = Math.floor(ms/1000);
  var h = Math.floor(totalSec/3600);
  var m = Math.floor((totalSec%3600)/60);
  var s = totalSec%60;
  var cent = Math.floor((ms%1000)/100);
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+cent;
}

function clockLoop() {
  var display = document.getElementById('clock-display');
  var dateEl = document.getElementById('clock-date');
  var now = new Date();

  if(clockMode === 'clock') {
    display.textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
    var weekDays2 = ['鏄熸湡鏃?,'鏄熸湡涓€','鏄熸湡浜?,'鏄熸湡涓?,'鏄熸湡鍥?,'鏄熸湡浜?,'鏄熸湡鍏?];
    dateEl.textContent = now.getFullYear()+'骞?+(now.getMonth()+1)+'鏈?+now.getDate()+'鏃?'+weekDays2[now.getDay()];
  } else if(clockMode === 'countdown') {
    var remain = countdownRemain;
    if(countdownRunning) {
      // 瀹炴椂鏄剧ず
    }
    display.textContent = formatTime(remain);
    var totalMin = Math.floor(countdownTotal/60);
    dateEl.textContent = '鎬昏 '+formatTime(countdownTotal);
  } else if(clockMode === 'stopwatch') {
    var elapsed = stopwatchElapsed;
    if(stopwatchRunning) elapsed += Date.now() - stopwatchStart;
    display.textContent = formatMs(elapsed);
    dateEl.textContent = '姝ｈ鏃?;
  }
}

/* ===== 瀵煎嚭妯″紡锛氫緵 PowerShell 閭欢鑴氭湰璇诲彇鏈畬鎴愪换鍔?===== */
function getUncompletedTasks() {
  var today = getTodayStr();
  var result = [];
  // 鏃ュ父浠诲姟
  for(var i=0;i<appData.daily.length;i++){
    if(!appData.daily[i].completed){
      result.push({
        title: appData.daily[i].title,
        priority: appData.daily[i].priority,
        category: appData.daily[i].category,
        source: 'daily'
      });
    }
  }
  // 涓存椂浠诲姟
  for(var i=0;i<appData.tempTasks.length;i++){
    if(!appData.tempTasks[i].completed){
      result.push({
        title: appData.tempTasks[i].title,
        priority: appData.tempTasks[i].priority,
        deadline: appData.tempTasks[i].tempDeadline || '',
        source: 'temp'
      });
    }
  }
  // 浠婃棩鏈堝害鍒版湡浠诲姟
  var now = new Date();
  var day = now.getDate();
  var month = now.getMonth()+1;
  for(var i=0;i<appData.midterm.length;i++){
    var item = appData.midterm[i];
    if(item.cycleDay === day){
      var isThisMonth = true;
      if(item.cycleMonths && item.cycleMonths.length){
        isThisMonth = item.cycleMonths.indexOf(month) >= 0;
      }
      if(isThisMonth){
        var key = today+'_'+item.id;
        if(!appData.monthlyCompleted[key]){
          result.push({
            title: item.title,
            priority: item.priority,
            cycleLabel: item.cycleLabel || '',
            source: 'monthly'
          });
        }
      }
    }
  }
  return result;
}
