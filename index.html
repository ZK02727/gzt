<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人工作台</title>
<style>
/* ===== 全局重置与基础 ===== */
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:"微软雅黑","Microsoft YaHei",sans-serif; font-size:14px; color:#333; background:#f0f2f5; height:100vh; overflow:hidden; display:flex; }

/* ===== 左侧导航栏 ===== */
.sidebar { width:240px; min-width:240px; background:#1e2a3a; color:#fff; display:flex; flex-direction:column; height:100vh; }
.sidebar-title { padding:24px 20px 8px; font-size:20px; font-weight:700; letter-spacing:1px; }
.sidebar-subtitle { padding:0 20px 20px; font-size:12px; color:#8eaadb; }
.nav-list { flex:1; }
.nav-item { display:flex; align-items:center; padding:14px 20px; cursor:pointer; transition:background .2s; position:relative; }
.nav-item:hover { background:#263548; }
.nav-item.active { background:#2b5797; }
.nav-icon { font-size:18px; margin-right:12px; width:24px; text-align:center; }
.nav-label { flex:1; font-size:15px; }
.nav-badge { background:#e74c3c; color:#fff; font-size:11px; border-radius:10px; padding:2px 8px; min-width:20px; text-align:center; }
.sidebar-footer { padding:16px 20px; font-size:12px; color:#6b8aaa; border-top:1px solid #263548; }

/* ===== 右侧内容区 ===== */
.main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
.main-header { padding:16px 32px; display:flex; align-items:center; justify-content:space-between; border-bottom:1px solid #e0e0e0; background:#fff; }
.main-header h2 { font-size:22px; color:#1e2a3a; }
.main-stats { display:flex; gap:20px; font-size:13px; color:#666; margin-top:4px; }
.main-stats span span { font-weight:700; color:#2b5797; }

/* ===== 顶部面板（日历+时钟） ===== */
.top-panel { background:#fff; border-bottom:1px solid #e0e0e0; }
.top-panel-inner { display:flex; gap:16px; padding:12px 32px; }

/* ===== 月历 ===== */
.calendar-section { flex:1; min-width:0; }
.calendar-nav { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.calendar-nav-btn { background:none; border:1px solid #ddd; border-radius:4px; padding:2px 8px; cursor:pointer; font-size:12px; }
.calendar-nav-btn:hover { background:#f5f5f5; }
.calendar-month { font-size:14px; font-weight:600; color:#1e2a3a; }
.calendar-toggle { background:none; border:none; cursor:pointer; font-size:13px; color:#999; transition:transform .2s; padding:2px 6px; border-radius:4px; }
.calendar-toggle:hover { color:#2b5797; background:#f0f2f5; }
.calendar-toggle.collapsed { transform:rotate(-90deg); }
.calendar-legend { display:flex; gap:12px; margin-left:auto; font-size:10px; color:#999; }
.legend-item { display:flex; align-items:center; gap:3px; }
.legend-dot { width:7px; height:7px; border-radius:50%; display:inline-block; }
.legend-dot.dot-month { background:#8e44ad; }
.legend-dot.dot-temp { background:#e74c3c; }
.legend-dot.dot-special { background:#f39c12; }
.calendar-body { overflow:hidden; transition:max-height .3s ease, opacity .3s ease; max-height:400px; opacity:1; }
.calendar-body.collapsed { max-height:0; opacity:0; }
.calendar-grid { display:grid; grid-template-columns:repeat(7,1fr); gap:1px; }
.cal-weekday { text-align:center; font-size:11px; color:#999; padding:2px 0; font-weight:500; }
.cal-day { text-align:center; padding:3px 0; border-radius:4px; font-size:12px; cursor:pointer; position:relative; transition:background .15s; }
.cal-day:hover { background:#f0f2f5; }
.cal-day.other-month { color:#ccc; }
.cal-day.today { background:#2b5797; color:#fff; font-weight:700; }
.cal-day.today:hover { background:#1e3a6e; }
.cal-day.has-month, .cal-day.has-temp, .cal-day.has-special { font-weight:600; }
.cal-day.has-month { color:#8e44ad; }
.cal-day.has-temp { color:#e74c3c; }
.cal-day.has-special { color:#f39c12; }
.cal-day.today.has-month, .cal-day.today.has-temp, .cal-day.today.has-special { color:#fff; }
.cal-dots { display:flex; justify-content:center; gap:1px; margin-top:1px; height:5px; }
.cal-dot-indicator { width:4px; height:4px; border-radius:50%; }
.cal-dot-indicator.dot-month { background:#8e44ad; }
.cal-dot-indicator.dot-temp { background:#e74c3c; }
.cal-dot-indicator.dot-special { background:#f39c12; }
.cal-day.today .cal-dot-indicator { background:#fff !important; }

/* ===== 今日待办两列布局 ===== */
.daily-columns { display:flex; gap:20px; }
.daily-col { flex:1; min-width:0; }
.daily-col-header { display:flex; align-items:center; justify-content:space-between; padding:8px 0 12px; border-bottom:2px solid #e0e0e0; margin-bottom:12px; }
.daily-col-title { font-size:16px; font-weight:600; color:#1e2a3a; display:flex; align-items:center; gap:6px; }
.daily-col-count { font-size:12px; color:#999; font-weight:400; }
.btn-add-sm { background:#2b5797; color:#fff; border:none; padding:5px 14px; border-radius:5px; cursor:pointer; font-size:12px; transition:background .2s; }
.btn-add-sm:hover { background:#1e3a6e; }

/* 分类分组 */
.category-group { margin-bottom:16px; }
.category-header { display:flex; align-items:center; padding:4px 0 8px; border-bottom:1px solid #f0f0f0; margin-bottom:8px; }
.category-icon { font-size:15px; margin-right:6px; }
.category-name { font-size:14px; font-weight:600; color:#1e2a3a; flex:1; }
.category-count { font-size:11px; color:#999; }

/* 任务卡片 */
.content-area { flex:1; overflow-y:auto; padding:20px 32px; }
.task-card { background:#fff; border-radius:8px; box-shadow:0 1px 4px rgba(0,0,0,.08); margin-bottom:8px; transition:box-shadow .2s; border-left:4px solid #2b5797; }
.task-card:hover { box-shadow:0 2px 8px rgba(0,0,0,.12); }
.task-card.priority-urgent { border-left-color:#e74c3c; }
.task-card.priority-important { border-left-color:#f39c12; }
.task-card.priority-routine { border-left-color:#3498db; }
.task-card.completed { opacity:.5; }
.task-card.completed .task-title { text-decoration:line-through; }
.task-card.from-monthly { border-left-color:#8e44ad; background:#faf8fc; }
.task-card.from-temp { border-left-color:#e67e22; background:#fef9f4; }

.task-header { display:flex; align-items:center; padding:10px 14px; cursor:pointer; }
.task-checkbox { width:18px; height:18px; border-radius:50%; border:2px solid #ccc; margin-right:12px; cursor:pointer; display:flex; align-items:center; justify-content:center; transition:all .2s; flex-shrink:0; }
.task-checkbox:hover { border-color:#2b5797; }
.task-checkbox.checked { background:#27ae60; border-color:#27ae60; }
.task-checkbox.checked::after { content:"\2713"; color:#fff; font-size:11px; }
.task-title { flex:1; font-size:14px; font-weight:500; }
.task-meta { display:flex; align-items:center; gap:8px; margin-left:auto; }
.priority-tag { font-size:10px; padding:2px 6px; border-radius:4px; color:#fff; }
.priority-tag.urgent { background:#e74c3c; }
.priority-tag.important { background:#f39c12; }
.priority-tag.routine { background:#3498db; }
.status-tag { font-size:10px; padding:2px 6px; border-radius:4px; }
.status-tag.wait { background:#ecf0f1; color:#95a5a6; }
.status-tag.progress { background:#e8f0fe; color:#2b5797; }
.status-tag.review { background:#fef5e7; color:#f39c12; }
.status-tag.done { background:#eafaf1; color:#27ae60; }
.cycle-tag { font-size:10px; padding:2px 6px; border-radius:4px; background:#e8e0f0; color:#8e44ad; white-space:nowrap; }
.source-tag { font-size:10px; padding:2px 6px; border-radius:4px; white-space:nowrap; }
.source-tag.monthly { background:#e8e0f0; color:#8e44ad; }
.source-tag.temp { background:#fde8d0; color:#e67e22; }
.task-expand { margin-left:4px; color:#999; transition:transform .2s; font-size:11px; }
.task-expand.open { transform:rotate(180deg); }

/* 展开详情 */
.task-detail { display:none; padding:0 14px 14px; border-top:1px solid #f0f0f0; }
.task-detail.show { display:block; }
.detail-section { margin-top:10px; }
.detail-label { font-size:12px; color:#999; margin-bottom:3px; }
.detail-text { font-size:13px; line-height:1.5; color:#555; }
.detail-progress { margin-top:6px; }
.progress-bar { height:6px; background:#e0e0e0; border-radius:3px; overflow:hidden; }
.progress-fill { height:100%; background:#2b5797; border-radius:3px; transition:width .3s; }
.progress-text { font-size:11px; color:#999; margin-top:3px; }

/* AI辅助区 */
.ai-assist { margin-top:12px; background:#f8f9fb; border-radius:6px; padding:12px; border:1px dashed #8eaadb; }
.ai-assist-title { font-size:12px; color:#2b5797; font-weight:600; margin-bottom:4px; }
.ai-assist-content { font-size:12px; color:#666; line-height:1.5; min-height:20px; white-space:pre-wrap; }
.ai-assist-empty { color:#bbb; font-style:italic; }

/* 里程碑列表 */
.milestone-list { list-style:none; margin-top:6px; }
.milestone-item { display:flex; align-items:center; padding:3px 0; font-size:12px; }
.milestone-check { width:14px; height:14px; border:1.5px solid #ccc; border-radius:3px; margin-right:8px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.milestone-check.checked { background:#27ae60; border-color:#27ae60; }
.milestone-check.checked::after { content:"\2713"; color:#fff; font-size:9px; }

/* OKR关键结果 */
.kr-list { margin-top:8px; }
.kr-item { background:#fff; border:1px solid #eee; border-radius:6px; padding:10px; margin-bottom:8px; }
.kr-title { font-size:13px; font-weight:500; margin-bottom:6px; }

/* 操作按钮 */
.task-actions { margin-top:10px; display:flex; gap:6px; }
.btn-sm { padding:4px 10px; border-radius:4px; border:1px solid #ddd; background:#fff; cursor:pointer; font-size:11px; transition:all .2s; }
.btn-sm:hover { background:#f5f5f5; }
.btn-sm.btn-danger { color:#e74c3c; border-color:#e74c3c; }
.btn-sm.btn-danger:hover { background:#e74c3c; color:#fff; }

/* 模态框 */
.modal-overlay { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,.4); z-index:1000; align-items:center; justify-content:center; }
.modal-overlay.show { display:flex; }
.modal-box { background:#fff; border-radius:10px; width:480px; max-height:80vh; overflow-y:auto; box-shadow:0 8px 32px rgba(0,0,0,.15); }
.modal-header { padding:16px 24px; border-bottom:1px solid #eee; display:flex; align-items:center; justify-content:space-between; }
.modal-header h3 { font-size:17px; }
.modal-close { background:none; border:none; font-size:20px; cursor:pointer; color:#999; }
.modal-close:hover { color:#333; }
.modal-body { padding:20px 24px; }
.form-group { margin-bottom:12px; }
.form-group label { display:block; font-size:13px; color:#666; margin-bottom:3px; }
.form-group input,.form-group select,.form-group textarea { width:100%; padding:7px 10px; border:1px solid #ddd; border-radius:6px; font-size:14px; font-family:inherit; }
.form-group textarea { min-height:70px; resize:vertical; }
.modal-footer { padding:12px 24px; border-top:1px solid #eee; display:flex; justify-content:flex-end; gap:10px; }
.btn-cancel { padding:7px 16px; border:1px solid #ddd; border-radius:6px; background:#fff; cursor:pointer; }
.btn-confirm { padding:7px 16px; border:none; border-radius:6px; background:#2b5797; color:#fff; cursor:pointer; }
.btn-confirm:hover { background:#1e3a6e; }

/* 确认弹窗 */
.confirm-box { width:360px; text-align:center; }
.confirm-box .modal-body { font-size:15px; padding:24px; }

/* 空状态 */
.empty-state { text-align:center; padding:40px 20px; color:#bbb; }
.empty-state .empty-icon { font-size:40px; margin-bottom:8px; }
.empty-state p { font-size:14px; }

/* 过渡动画 */
.fade-in { animation:fadeIn .3s ease; }
@keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:translateY(0)} }

/* 滚动条 */
.content-area::-webkit-scrollbar { width:6px; }
.content-area::-webkit-scrollbar-thumb { background:#ccc; border-radius:3px; }
.content-area::-webkit-scrollbar-thumb:hover { background:#aaa; }

/* ===== 电子时钟 ===== */
.clock-section { width:320px; flex-shrink:0; display:flex; flex-direction:column; align-items:center; justify-content:center; padding:4px 0; }
.clock-row { display:flex; align-items:center; gap:12px; }
.clock-display { font-family:'Courier New','Consolas',monospace; font-size:36px; font-weight:700; color:#1e2a3a; letter-spacing:2px; line-height:1.1; text-align:center; }
.clock-right { display:flex; flex-direction:column; align-items:flex-start; gap:3px; }
.clock-date { font-size:11px; color:#999; white-space:nowrap; }
.clock-mode-label { font-size:11px; color:#2b5797; cursor:pointer; padding:1px 8px; border:1px solid #8eaadb; border-radius:10px; transition:all .2s; user-select:none; white-space:nowrap; }
.clock-mode-label:hover { background:#2b5797; color:#fff; border-color:#2b5797; }
.clock-toolbar { display:flex; align-items:center; gap:6px; margin-top:4px; flex-wrap:wrap; justify-content:center; }
.clock-ctrl-btn { background:none; border:1px solid #ddd; border-radius:4px; padding:2px 10px; cursor:pointer; font-size:11px; transition:all .2s; white-space:nowrap; }
.clock-ctrl-btn:hover { background:#2b5797; color:#fff; border-color:#2b5797; }
.clock-input { width:42px; padding:2px 4px; border:1px solid #ddd; border-radius:4px; font-size:12px; text-align:center; font-family:'Courier New',monospace; }
.clock-input-label { font-size:10px; color:#999; }
</style>
</head>
<body>

<!-- 左侧导航 -->
<div class="sidebar">
  <div class="sidebar-title">个人工作台</div>
  <div class="sidebar-subtitle">DAILY WORKBENCH</div>
  <div class="nav-list">
    <div class="nav-item active" data-tab="daily" onclick="switchTab('daily')">
      <span class="nav-icon">📋</span>
      <span class="nav-label">今日待办</span>
      <span class="nav-badge" id="badge-daily">0</span>
    </div>
    <div class="nav-item" data-tab="midterm" onclick="switchTab('midterm')">
      <span class="nav-icon">📅</span>
      <span class="nav-label">月度周期</span>
      <span class="nav-badge" id="badge-midterm">0</span>
    </div>
    <div class="nav-item" data-tab="longterm" onclick="switchTab('longterm')">
      <span class="nav-icon">🎯</span>
      <span class="nav-label">长期事项</span>
      <span class="nav-badge" id="badge-longterm">0</span>
    </div>
  </div>
  <div class="sidebar-footer">
    <div id="sidebar-date"></div>
    <div id="sync-status" style="font-size:10px;color:#f39c12;margin-top:8px;">⏳ 检测中...</div>
    <div style="margin-top:6px;display:flex;flex-direction:column;gap:4px;">
      <button class="btn-add-sm" style="width:100%;font-size:11px;padding:5px 0;" onclick="showTokenConfig()">☁️ 云端同步配置</button>
      <div style="display:flex;gap:4px;">
        <button class="btn-add-sm" style="flex:1;font-size:10px;padding:4px 0;background:#27ae60;" onclick="exportDataFile()">📤 导出</button>
        <button class="btn-add-sm" style="flex:1;font-size:10px;padding:4px 0;background:#8e44ad;" onclick="importDataFile()">📥 导入</button>
      </div>
      <div style="font-size:9px;color:#6b8aaa;line-height:1.3;">配置Token后数据自动云端同步<br>手机/电脑/平板 随时切换</div>
    </div>
  </div>
</div>

<!-- 右侧内容区 -->
<div class="main">
  <!-- 顶部面板：日历+时钟 -->
  <div class="top-panel" id="top-panel">
    <div class="top-panel-inner">
      <!-- 月历 -->
      <div class="calendar-section">
        <div class="calendar-nav">
          <button class="calendar-nav-btn" onclick="calPrev()">&lt;</button>
          <span class="calendar-month" id="cal-month-label"></span>
          <button class="calendar-nav-btn" onclick="calNext()">&gt;</button>
          <button class="calendar-nav-btn" onclick="calToday()">今天</button>
          <button class="calendar-toggle" id="cal-toggle" onclick="toggleCalendar()" title="折叠/展开">▼</button>
          <div class="calendar-legend">
            <span class="legend-item"><span class="legend-dot dot-month"></span>月度待办</span>
            <span class="legend-item"><span class="legend-dot dot-temp"></span>临时截止</span>
            <span class="legend-item"><span class="legend-dot dot-special"></span>特殊日期</span>
          </div>
        </div>
        <div class="calendar-body" id="cal-body">
          <div class="calendar-grid" id="cal-grid"></div>
        </div>
      </div>
      <!-- 电子时钟 -->
      <div class="clock-section">
        <div class="clock-row">
          <div class="clock-display" id="clock-display">00:00:00</div>
          <div class="clock-right">
            <div class="clock-date" id="clock-date"></div>
            <div class="clock-mode-label" id="clock-mode-label" onclick="switchClockMode()">普通时钟</div>
          </div>
        </div>
        <div class="clock-toolbar" id="clock-controls"></div>
      </div>
    </div>
  </div>

  <!-- 标题栏 -->
  <div class="main-header">
    <div>
      <h2 id="main-title">今日待办</h2>
      <div class="main-stats" id="main-stats"></div>
    </div>
  </div>

  <div class="content-area" id="content-area"></div>
</div>

<!-- 添加/编辑模态框 -->
<div class="modal-overlay" id="modal-add">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modal-title">添加事项</h3>
      <button class="modal-close" onclick="closeAddModal()">&times;</button>
    </div>
    <div class="modal-body" id="modal-body"></div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeAddModal()">取消</button>
      <button class="btn-confirm" id="modal-save" onclick="saveItem()">保存</button>
    </div>
  </div>
</div>

<!-- 确认删除模态框 -->
<div class="modal-overlay" id="modal-confirm">
  <div class="modal-box confirm-box">
    <div class="modal-body" id="confirm-text">确定删除此事项？</div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeConfirm()">取消</button>
      <button class="btn-confirm" style="background:#e74c3c" onclick="doConfirm()">删除</button>
    </div>
  </div>
</div>

/* ===== Gist 云端同步 ===== */
function syncToGist(data) {
  var token = getGitHubToken();
  if (!token) {
    updateSyncStatus('cloud-no-token');
    return;
  }
  if (cloudSyncing) return; // 防止并发
  cloudSyncing = true;
  var payload = {
    description: 'GZT Workbench Data',
    files: {}
  };
  payload.files[GIST_FILENAME] = {
    content: JSON.stringify(data, null, 2)
  };
  try {
    var xhr = new XMLHttpRequest();
    xhr.open('PATCH', GIST_API, true);
    xhr.setRequestHeader('Authorization', 'token ' + token);
    xhr.setRequestHeader('Content-Type', 'application/json');
    xhr.onreadystatechange = function() {
      if (xhr.readyState === 4) {
        cloudSyncing = false;
        if (xhr.status >= 200 && xhr.status < 300) {
          lastCloudSync = new Date();
          updateSyncStatus('cloud-ok');
        } else {
          updateSyncStatus('cloud-error');
          console.log('Gist sync error:', xhr.status, xhr.responseText);
        }
      }
    };
    xhr.send(JSON.stringify(payload));
  } catch(e) {
    cloudSyncing = false;
    updateSyncStatus('cloud-error');
  }
}

function loadFromGist(callback) {
  var xhr = new XMLHttpRequest();
  xhr.open('GET', GIST_API, true);
  xhr.onreadystatechange = function() {
    if (xhr.readyState === 4) {
      if (xhr.status >= 200 && xhr.status < 300) {
        try {
          var gist = JSON.parse(xhr.responseText);
          var content = gist.files[GIST_FILENAME].content;
          var cloudData = JSON.parse(content);
          callback(cloudData, null);
        } catch(e) {
          callback(null, '解析失败');
        }
      } else {
        callback(null, 'HTTP ' + xhr.status);
      }
    }
  };
  xhr.send();
}

/* ===== 同步状态显示 ===== */
function updateSyncStatus(state) {
  var el = document.getElementById('sync-status');
  if (!el) return;
  switch(state) {
    case 'cloud-ok':
      el.textContent = '☁️ 云端已同步 ' + new Date().toLocaleTimeString('zh-CN');
      el.style.color = '#27ae60'; break;
    case 'cloud-no-token':
      el.textContent = '⚠️ 未配置Token，仅本地';
      el.style.color = '#f39c12'; break;
    case 'cloud-error':
      el.textContent = '☁️ 云端同步失败';
      el.style.color = '#e74c3c'; break;
    case 'cloud-loading':
      el.textContent = '☁️ 正在同步...';
      el.style.color = '#2b5797'; break;
    case 'local-only':
      el.textContent = '本地模式';
      el.style.color = '#999'; break;
  }
}

/* ===== 首次打开拉取云端数据 ===== */
function initCloudSync() {
  var token = getGitHubToken();
  if (!token) {
    // 即使没有Token，也尝试从Gist公开API拉取数据（Gist是公开的，读取不需要Token）
    var hasLocalData = localStorage.getItem(LS_CACHE_KEY);
    if (!hasLocalData || hasLocalData === '{}') {
      updateSyncStatus('cloud-loading');
      loadFromGist(function(cloudData, err) {
        if (cloudData && cloudData.daily && cloudData.daily.length > 0) {
          appData = cloudData;
          localStorage.setItem(LS_CACHE_KEY, JSON.stringify(appData));
          renderContent();
          renderCalendar();
          updateSyncStatus('cloud-no-token');
        } else {
          updateSyncStatus('cloud-no-token');
        }
      });
    } else {
      updateSyncStatus('cloud-no-token');
    }
    return;
  }
  updateSyncStatus('cloud-loading');
  loadFromGist(function(cloudData, err) {
    if (cloudData) {
      // 合并策略：如果云端数据比本地新，用云端数据
      var localTime = localStorage.getItem('workbench_save_time') || '0';
      var cloudIsNewer = !appData._lastModified || (cloudData._lastModified && cloudData._lastModified > appData._lastModified);
      if (cloudIsNewer && cloudData.daily && cloudData.daily.length > 0) {
        appData = cloudData;
        localStorage.setItem(LS_CACHE_KEY, JSON.stringify(appData));
        renderContent();
        renderCalendar();
        updateSyncStatus('cloud-ok');
      } else {
        // 本地更新，推送到云端
        syncToGist(appData);
      }
    } else {
      updateSyncStatus('cloud-error');
      console.log('Cloud sync failed:', err);
    }
  });
}

function initCalendar() {

  calYear = now.getFullYear();
  calMonth = now.getMonth();

}

function calPrev() { calMonth--; if(calMonth<0){calMonth=11;calYear--;} renderCalendar(); }
function calNext() { calMonth++; if(calMonth>11){calMonth=0;calYear++;} renderCalendar(); }
function calToday() { var now=new Date(); calYear=now.getFullYear(); calMonth=now.getMonth(); renderCalendar(); }

function renderCalendar() {
  document.getElementById('cal-month-label').textContent = calYear+'年'+(calMonth+1)+'月';
  var grid = document.getElementById('cal-grid');
  grid.innerHTML = '';

  // 星期标题
  var weekLabels = ['一','二','三','四','五','六','日'];
  for(var w=0;w<7;w++){
    var wd = document.createElement('div');
    wd.className = 'cal-weekday';
    wd.textContent = weekLabels[w];
    grid.appendChild(wd);
  }

  var firstDay = new Date(calYear, calMonth, 1);
  var startWeekday = firstDay.getDay(); // 0=日
  startWeekday = startWeekday === 0 ? 6 : startWeekday - 1; // 转为0=一
  var daysInMonth = new Date(calYear, calMonth+1, 0).getDate();
  var prevDays = new Date(calYear, calMonth, 0).getDate();

  var today = new Date();
  var todayY = today.getFullYear(), todayM = today.getMonth(), todayD = today.getDate();

  // 获取本月有月度待办的日期
  var monthlyDays = getMonthlyTaskDays(calYear, calMonth+1);
  // 获取临时任务截止日
  var tempDeadlineDays = getTempDeadlineDays(calYear, calMonth+1);

  // 上月填充
  for(var i=startWeekday-1;i>=0;i--){
    var d = document.createElement('div');
    d.className = 'cal-day other-month';
    d.innerHTML = '<div>'+(prevDays-i)+'</div><div class="cal-dots"></div>';
    grid.appendChild(d);
  }

  // 本月
  for(var day=1;day<=daysInMonth;day++){
    var d = document.createElement('div');
    var isToday = (calYear===todayY && calMonth===todayM && day===todayD);
    var classes = ['cal-day'];
    if(isToday) classes.push('today');

    var dotHtml = '<div class="cal-dots">';
    if(monthlyDays.indexOf(day)>=0){ classes.push('has-month'); dotHtml+='<span class="cal-dot-indicator dot-month"></span>'; }
    if(tempDeadlineDays.indexOf(day)>=0){ classes.push('has-temp'); dotHtml+='<span class="cal-dot-indicator dot-temp"></span>'; }
    var specialKey = (calMonth+1)+'-'+day;
    if(SPECIAL_DATES[specialKey]){ classes.push('has-special'); dotHtml+='<span class="cal-dot-indicator dot-special"></span>'; }
    dotHtml += '</div>';

    d.className = classes.join(' ');
    d.innerHTML = '<div>'+day+'</div>'+dotHtml;
    grid.appendChild(d);
  }

  // 下月填充（补满6行）
  var totalCells = startWeekday + daysInMonth;
  var remaining = (7 - totalCells%7)%7;
  for(var i=1;i<=remaining;i++){
    var d = document.createElement('div');
    d.className = 'cal-day other-month';
    d.innerHTML = '<div>'+i+'</div><div class="cal-dots"></div>';
    grid.appendChild(d);
  }
}

function getMonthlyTaskDays(year, month) {
  var days = [];
  for(var i=0;i<appData.midterm.length;i++){
    var item = appData.midterm[i];
    if(item.cycleMonths && item.cycleMonths.length){
      // 季度任务
      for(var j=0;j<item.cycleMonths.length;j++){
        if(item.cycleMonths[j]===month && item.cycleDay) days.push(item.cycleDay);
      }
    } else if(item.cycleDay){
      days.push(item.cycleDay);
    }
  }
  // 去重
  var unique = [];
  for(var i=0;i<days.length;i++){ if(unique.indexOf(days[i])<0) unique.push(days[i]); }
  unique.sort(function(a,b){return a-b;});
  return unique;
}

function getTempDeadlineDays(year, month) {
  var days = [];
  for(var i=0;i<appData.tempTasks.length;i++){
    var t = appData.tempTasks[i];
    if(t.tempDeadline){
      var parts = t.tempDeadline.split('-');
      if(parseInt(parts[0])===year && parseInt(parts[1])===month){
        days.push(parseInt(parts[2]));
      }
    }
  }
  var unique = [];
  for(var i=0;i<days.length;i++){ if(unique.indexOf(days[i])<0) unique.push(days[i]); }
  unique.sort(function(a,b){return a-b;});
  return unique;
}

/* ===== 判断月度任务今天是否触发 ===== */
function getTodayMonthlyItems() {
  var today = new Date();
  var day = today.getDate();
  var month = today.getMonth()+1;
  var result = [];
  for(var i=0;i<appData.midterm.length;i++){
    var item = appData.midterm[i];
    if(item.cycleDay === day){
      if(item.cycleMonths && item.cycleMonths.length){
        if(item.cycleMonths.indexOf(month)>=0) result.push(item);
      } else {
        result.push(item);
      }
    }
  }
  return result;
}

    var catDone = 0;
    for(var d=0;d<catItems.length;d++){ if(catItems[d].completed) catDone++; }
    group.innerHTML = '<div class="category-header"><span class="category-icon">'+catDef.icon+'</span><span class="category-name">'+esc(catDef.name)+'</span><span class="category-count">'+catDone+'/'+catItems.length+'</span></div>';
    for(var idx=0;idx<catItems.length;idx++){
      group.appendChild(createDailyCard(catItems[idx], 'routine'));
    }
    leftCol.appendChild(group);
  }

  container.appendChild(leftCol);

  // === 右列：临时任务 + 今日月度任务 ===
  var rightCol = document.createElement('div');
  rightCol.className = 'daily-col';

  // 今日月度任务
  var todayMonthly = getTodayMonthlyItems();
  var rightTotal = appData.tempTasks.length + todayMonthly.length;
  var rightDone = 0;
  for(var i=0;i<appData.tempTasks.length;i++){ if(appData.tempTasks[i].completed) rightDone++; }
  for(var i=0;i<todayMonthly.length;i++){
    var key = getTodayStr()+'_'+todayMonthly[i].id;
    if(appData.monthlyCompleted[key]) rightDone++;
  }

  rightCol.innerHTML = '<div class="daily-col-header"><div class="daily-col-title">⚡ 零散任务 <span class="daily-col-count">('+rightDone+'/'+rightTotal+')</span></div><button class="btn-add-sm" onclick="openAddModal(\'temp\')">+ 临时</button></div>';

  // 今日月度任务卡片
  if(todayMonthly.length){
    var mGroup = document.createElement('div');
    mGroup.className = 'category-group fade-in';
    mGroup.innerHTML = '<div class="category-header"><span class="category-icon">📅</span><span class="category-name">今日月度到期</span><span class="category-count">'+todayMonthly.length+'项</span></div>';
    for(var i=0;i<todayMonthly.length;i++){
      mGroup.appendChild(createMonthlyTodayCard(todayMonthly[i]));
    }
    rightCol.appendChild(mGroup);
  }

  // 临时任务卡片
  if(appData.tempTasks.length){
    var tGroup = document.createElement('div');
    tGroup.className = 'category-group fade-in';
    tGroup.innerHTML = '<div class="category-header"><span class="category-icon">⚡</span><span class="category-name">临时任务</span></div>';
    for(var i=0;i<appData.tempTasks.length;i++){
      tGroup.appendChild(createTempCard(appData.tempTasks[i]));
    }
    rightCol.appendChild(tGroup);
  }

  if(!rightTotal){
    rightCol.innerHTML += '<div class="empty-state" style="padding:30px 10px"><div class="empty-icon">⚡</div><p>暂无临时任务</p></div>';
  }

  container.appendChild(rightCol);
  area.appendChild(container);
}

function createDailyCard(item, colType) {
  var pClass = item.priority==='urgent'?'priority-urgent':(item.priority==='important'?'priority-important':'priority-routine');
  var pTag = item.priority==='urgent'?'紧急':(item.priority==='important'?'重要':'日常');
  var card = document.createElement('div');
  card.className = 'task-card '+pClass+(item.completed?' completed':'')+' fade-in';
  var descHtml = item.desc ? '<div class="detail-section"><div class="detail-label">说明</div><div class="detail-text">'+esc(item.desc)+'</div></div>' : '';

  // 媒体播放器区域 - 自动判断在线/本地路径
  var mediaHtml = '';
  if(item.mediaFile) {
    var mediaUrl = item.mediaFile;
    if(mediaUrl.indexOf('://')===-1) {
      // 相对路径：根据当前页面URL判断基础路径
      var pageHost = window.location.hostname;
      if(pageHost && pageHost.indexOf('github.io')!==-1) {
        // GitHub Pages在线版：视频在仓库根目录
        var repoName = window.location.pathname.split('/')[1] || 'gzt';
        mediaUrl = '/' + repoName + '/' + mediaUrl;
      }
      // 本地文件：相对路径直接使用同目录下的文件
    }
    mediaHtml = '<div class="detail-section"><div class="detail-label">训练视频</div>' +
      '<video class="media-player" id="video-'+item.id+'" controls style="width:100%;max-width:400px;border-radius:8px;margin-top:6px;background:#000;" ' +
      'onended="onVideoEnd(\''+item.id+'\')">' +
      '<source src="'+mediaUrl+'" type="video/mp4">浏览器不支持视频播放</video>' +
      '<div id="video-status-'+item.id+'" style="font-size:12px;color:#999;margin-top:4px;"></div></div>';
  }

  card.innerHTML =
    '<div class="task-header" onclick="toggleDetail(this)">' +
      '<div class="task-checkbox'+(item.completed?' checked':'')+'" onclick="event.stopPropagation();toggleDaily(\''+item.id+'\')"></div>' +
      '<div class="task-title">'+esc(item.title)+'</div>' +
      '<div class="task-meta">' +
        (item.mediaFile?'<span style="font-size:11px;color:#8e44ad;">▶ 视频</span>':'') +
        '<span class="priority-tag '+item.priority+'">'+pTag+'</span>' +
        '<span class="task-expand">▼</span>' +
      '</div>' +
    '</div>' +
    '<div class="task-detail" id="detail-'+item.id+'">' +
      descHtml + mediaHtml +
      '<div class="ai-assist"><div class="ai-assist-title">🤖 AI 辅助</div><div class="ai-assist-content">'+(item.aiAssist?esc(item.aiAssist):'<span class="ai-assist-empty">暂无辅助内容，可告知智能体添加</span>')+'</div></div>' +
      '<div class="task-actions"><button class="btn-sm" onclick="event.stopPropagation();openEditModal(\'daily\',\''+item.id+'\')">编辑</button><button class="btn-sm btn-danger" onclick="event.stopPropagation();deleteItem(\'daily\',\''+item.id+'\')">删除</button></div>' +
    '</div>';
  return card;
}

  var statusEl = document.getElementById('video-status-'+itemId);
  if(statusEl) statusEl.innerHTML = '<span style="color:#27ae60;font-weight:600;">✓ 视频播放完成，请确认完成此任务</span>';

/* ===== 交互：展开/折叠 ===== */
function toggleDetail(headerEl) {
  var card = headerEl.parentElement;
  var detailEl = card.querySelector('.task-detail');
  var expandIcon = headerEl.querySelector('.task-expand');
  if(detailEl){ detailEl.classList.toggle('show'); if(expandIcon) expandIcon.classList.toggle('open'); }
}

/* ===== 交互：勾选完成 ===== */
function toggleDaily(id) {
  for(var i=0;i<appData.daily.length;i++){
    if(appData.daily[i].id===id){ appData.daily[i].completed=!appData.daily[i].completed; break; }
  }
  saveData(appData); renderContent();
}

function toggleTemp(id) {
  for(var i=0;i<appData.tempTasks.length;i++){
    if(appData.tempTasks[i].id===id){ appData.tempTasks[i].completed=!appData.tempTasks[i].completed; break; }
  }
  saveData(appData); renderContent();
}

function toggleMonthlyToday(mid) {
  var key = getTodayStr()+'_'+mid;
  if(appData.monthlyCompleted[key]) delete appData.monthlyCompleted[key];
  else appData.monthlyCompleted[key] = true;
  saveData(appData); renderContent();
}

function toggleMidtermStatus(id) {
  for(var i=0;i<appData.midterm.length;i++){
    if(appData.midterm[i].id===id){
      appData.midterm[i].status = appData.midterm[i].status==='done'?'wait':'done';
      break;
    }
  }
  saveData(appData); renderContent();
}

/* ===== 添加/编辑模态框 ===== */
var addModalType = 'routine'; // 'routine' 或 'temp'

function openAddModal(type) {
  editingId = null;
  addModalType = type || 'routine';
  document.getElementById('modal-title').textContent = type==='temp'?'添加临时任务':'添加日常任务';
  renderForm(type, null);
  document.getElementById('modal-add').classList.add('show');
}

function openEditModal(tab, id) {
  editingId = id;
  var item = null;
  if(tab==='temp'){
    for(var i=0;i<appData.tempTasks.length;i++){ if(appData.tempTasks[i].id===id){ item=appData.tempTasks[i]; break; } }
    addModalType = 'temp';
  } else if(tab==='daily'){
    for(var i=0;i<appData.daily.length;i++){ if(appData.daily[i].id===id){ item=appData.daily[i]; break; } }
    addModalType = 'routine';
  } else if(tab==='midterm'){
    for(var i=0;i<appData.midterm.length;i++){ if(appData.midterm[i].id===id){ item=appData.midterm[i]; break; } }
    addModalType = 'midterm';
  } else {
    for(var i=0;i<appData.longterm.length;i++){ if(appData.longterm[i].id===id){ item=appData.longterm[i]; break; } }
    addModalType = 'longterm';
  }
  document.getElementById('modal-title').textContent = '编辑事项';
  renderForm(addModalType, item);
  document.getElementById('modal-add').classList.add('show');
}

function closeAddModal() { document.getElementById('modal-add').classList.remove('show'); }

function saveItem() {
  var title = document.getElementById('f-title').value.trim();
  if(!title){ alert('请输入标题'); return; }
  var desc = (document.getElementById('f-desc')||{}).value || '';

  if(addModalType === 'routine'){
    if(editingId){
      for(var i=0;i<appData.daily.length;i++){
        if(appData.daily[i].id===editingId){ appData.daily[i].title=title; appData.daily[i].desc=desc; appData.daily[i].category=document.getElementById('f-category').value; appData.daily[i].priority=document.getElementById('f-priority').value; break; }
      }
    } else {
      appData.daily.push({ id:genId(), title:title, desc:desc, priority:document.getElementById('f-priority').value, category:document.getElementById('f-category').value, completed:false, createdAt:getTodayStr(), aiAssist:'', isTemp:false, tempDeadline:'' });
    }
  } else if(addModalType === 'temp'){
    if(editingId){
      for(var i=0;i<appData.tempTasks.length;i++){
        if(appData.tempTasks[i].id===editingId){ appData.tempTasks[i].title=title; appData.tempTasks[i].desc=desc; appData.tempTasks[i].priority=document.getElementById('f-priority').value; appData.tempTasks[i].tempDeadline=document.getElementById('f-deadline').value; break; }
      }
    } else {
      appData.tempTasks.push({ id:genId(), title:title, desc:desc, priority:document.getElementById('f-priority').value, completed:false, createdAt:getTodayStr(), aiAssist:'', isTemp:true, tempDeadline:document.getElementById('f-deadline').value });
    }
  } else if(addModalType === 'midterm'){
    var cycleLabel = (document.getElementById('f-cycleLabel')||{}).value || '';
    var cycleDay = parseInt((document.getElementById('f-cycleDay')||{}).value) || 1;
    if(editingId){
      for(var i=0;i<appData.midterm.length;i++){
        if(appData.midterm[i].id===editingId){ appData.midterm[i].title=title; appData.midterm[i].desc=desc; appData.midterm[i].priority=document.getElementById('f-priority').value; appData.midterm[i].cycleLabel=cycleLabel; appData.midterm[i].cycleDay=cycleDay; break; }
      }
    } else {
      appData.midterm.push({ id:genId(), title:title, desc:desc, priority:document.getElementById('f-priority').value, status:'wait', progress:0, deadline:'', cycleDay:cycleDay, cycleLabel:cycleLabel, milestones:[], aiAssist:'' });
    }
  } else {
    if(editingId){
      for(var i=0;i<appData.longterm.length;i++){
        if(appData.longterm[i].id===editingId){ appData.longterm[i].title=title; appData.longterm[i].desc=desc; appData.longterm[i].quarter=document.getElementById('f-quarter').value; break; }
      }
    } else {
      appData.longterm.push({ id:genId(), title:title, desc:desc, quarter:document.getElementById('f-quarter').value, keyResults:[], aiAssist:'' });
    }
  }

  saveData(appData);
  closeAddModal();
  renderContent();
  renderCalendar();
}

/* ===== 删除 ===== */
function deleteItem(tab, id) {
  confirmCallback = function(){
    if(tab==='temp'){
      var newArr = [];
      for(var i=0;i<appData.tempTasks.length;i++){ if(appData.tempTasks[i].id!==id) newArr.push(appData.tempTasks[i]); }
      appData.tempTasks = newArr;
    } else {
      var newArr = [];
      for(var i=0;i<appData[tab].length;i++){ if(appData[tab][i].id!==id) newArr.push(appData[tab][i]); }
      appData[tab] = newArr;
    }
    saveData(appData); renderContent(); renderCalendar();
  };
  document.getElementById('confirm-text').textContent = '确定删除此事项？';
  document.getElementById('modal-confirm').classList.add('show');
}

function closeConfirm() { document.getElementById('modal-confirm').classList.remove('show'); confirmCallback=null; }
function doConfirm() { if(confirmCallback) confirmCallback(); closeConfirm(); }

/* ===== 日历折叠 ===== */
var calCollapsed = false;
function toggleCalendar() {
  calCollapsed = !calCollapsed;
  var body = document.getElementById('cal-body');
  var btn = document.getElementById('cal-toggle');
  if(calCollapsed){ body.classList.add('collapsed'); btn.classList.add('collapsed'); }
  else { body.classList.remove('collapsed'); btn.classList.remove('collapsed'); }
}

/* ===== 电子时钟 ===== */
var clockMode = 'clock'; // 'clock' | 'countdown' | 'stopwatch'
var clockModes = ['clock','countdown','stopwatch'];
var clockModeLabels = { clock:'普通时钟', countdown:'倒计时', stopwatch:'正计时' };

// 倒计时状态
var countdownTotal = 0; // 总秒数
var countdownRemain = 0; // 剩余秒数
var countdownRunning = false;
var countdownTimer = null;
var countdownInputH = 0, countdownInputM = 5, countdownInputS = 0;

// 正计时状态
var stopwatchElapsed = 0; // 已过毫秒
var stopwatchRunning = false;
var stopwatchTimer = null;
var stopwatchStart = 0;

function switchClockMode() {
  var idx = clockModes.indexOf(clockMode);
  clockMode = clockModes[(idx+1)%clockModes.length];
  updateClockUI();
}

function updateClockUI() {
  document.getElementById('clock-mode-label').textContent = clockModeLabels[clockMode];
  var controls = document.getElementById('clock-controls');

  if(clockMode === 'clock') {
    controls.innerHTML = '';
  } else if(clockMode === 'countdown') {
    if(!countdownRunning && countdownRemain <= 0) {
      controls.innerHTML = '<div class="clock-toolbar">' +
        '<input class="clock-input" id="cd-h" type="number" min="0" max="23" value="'+countdownInputH+'"><span class="clock-input-label">时</span>' +
        '<input class="clock-input" id="cd-m" type="number" min="0" max="59" value="'+countdownInputM+'"><span class="clock-input-label">分</span>' +
        '<input class="clock-input" id="cd-s" type="number" min="0" max="59" value="'+countdownInputS+'"><span class="clock-input-label">秒</span>' +
        '<button class="clock-ctrl-btn" onclick="startCountdown()">开始</button>' +
        '</div>';
    } else {
      var pauseLabel = countdownRunning ? '暂停' : (countdownRemain > 0 ? '继续' : '重新');
      controls.innerHTML = '<div class="clock-toolbar"><button class="clock-ctrl-btn" onclick="pauseCountdown()">'+pauseLabel+'</button><button class="clock-ctrl-btn" onclick="resetCountdown()">重置</button></div>';
    }
  } else if(clockMode === 'stopwatch') {
    var startLabel = stopwatchRunning ? '暂停' : (stopwatchElapsed > 0 ? '继续' : '开始');
    controls.innerHTML = '<div class="clock-toolbar"><button class="clock-ctrl-btn" onclick="toggleStopwatch()">'+startLabel+'</button><button class="clock-ctrl-btn" onclick="resetStopwatch()">重置</button></div>';
  }
}

function startCountdown() {
  var h = parseInt(document.getElementById('cd-h').value) || 0;
  var m = parseInt(document.getElementById('cd-m').value) || 0;
  var s = parseInt(document.getElementById('cd-s').value) || 0;
  countdownInputH = h; countdownInputM = m; countdownInputS = s;
  countdownTotal = h*3600 + m*60 + s;
  if(countdownTotal <= 0) return;
  countdownRemain = countdownTotal;
  countdownRunning = true;
  if(countdownTimer) clearInterval(countdownTimer);
  countdownTimer = setInterval(tickCountdown, 1000);
  updateClockUI();
}

function tickCountdown() {
  if(countdownRemain > 0) {
    countdownRemain--;
  }
  if(countdownRemain <= 0) {
    countdownRunning = false;
    clearInterval(countdownTimer);
    countdownTimer = null;
    // 闪炼提醒
    var disp = document.getElementById('clock-display');
    disp.style.color = '#e74c3c';
    setTimeout(function(){ disp.style.color = ''; }, 3000);
  }
}

function pauseCountdown() {
  if(countdownRemain <= 0) { resetCountdown(); return; }
  countdownRunning = !countdownRunning;
  if(countdownRunning) {
    countdownTimer = setInterval(tickCountdown, 1000);
  } else {
    clearInterval(countdownTimer); countdownTimer = null;
  }
  updateClockUI();
}

function resetCountdown() {
  countdownRunning = false;
  countdownRemain = 0;
  if(countdownTimer){ clearInterval(countdownTimer); countdownTimer = null; }
  updateClockUI();
}

function toggleStopwatch() {
  if(stopwatchRunning) {
    stopwatchRunning = false;
    stopwatchElapsed += Date.now() - stopwatchStart;
    clearInterval(stopwatchTimer); stopwatchTimer = null;
  } else {
    stopwatchRunning = true;
    stopwatchStart = Date.now();
    stopwatchTimer = setInterval(tickStopwatch, 50);
  }
  updateClockUI();
}

function tickStopwatch() {
  // 渲染由clockLoop统一处理
}

function resetStopwatch() {
  stopwatchRunning = false;
  stopwatchElapsed = 0;
  if(stopwatchTimer){ clearInterval(stopwatchTimer); stopwatchTimer = null; }
  updateClockUI();
}

function formatTime(totalSec) {
  var h = Math.floor(totalSec/3600);
  var m = Math.floor((totalSec%3600)/60);
  var s = totalSec%60;
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0');
}

function formatMs(ms) {
  var totalSec = Math.floor(ms/1000);
  var h = Math.floor(totalSec/3600);
  var m = Math.floor((totalSec%3600)/60);
  var s = totalSec%60;
  var cent = Math.floor((ms%1000)/100);
  return String(h).padStart(2,'0')+':'+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+'.'+cent;
}

function clockLoop() {
  var display = document.getElementById('clock-display');
  var dateEl = document.getElementById('clock-date');
  var now = new Date();

  if(clockMode === 'clock') {
    display.textContent = String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0')+':'+String(now.getSeconds()).padStart(2,'0');
    var weekDays2 = ['星期日','星期一','星期二','星期三','星期四','星期五','星期六'];
    dateEl.textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 '+weekDays2[now.getDay()];
  } else if(clockMode === 'countdown') {
    var remain = countdownRemain;
    if(countdownRunning) {
      // 实时显示
    }
    display.textContent = formatTime(remain);
    var totalMin = Math.floor(countdownTotal/60);
    dateEl.textContent = '总计 '+formatTime(countdownTotal);
  } else if(clockMode === 'stopwatch') {
    var elapsed = stopwatchElapsed;
    if(stopwatchRunning) elapsed += Date.now() - stopwatchStart;
    display.textContent = formatMs(elapsed);
    dateEl.textContent = '正计时';
  }
}

/* ===== 每日自动重置 ===== */
function checkDailyReset() {
  var today = getTodayStr();
  if(appData.lastResetDate !== today) {
    // 新的一天：日常任务全部恢复为未完成
    for(var i=0;i<appData.daily.length;i++){
      appData.daily[i].completed = false;
    }
    // 清理过期的月度完成记录（只保留今天的）
    var newMC = {};
    for(var key in appData.monthlyCompleted){
      if(key.indexOf(today+'_') === 0) newMC[key] = appData.monthlyCompleted[key];
    }
    appData.monthlyCompleted = newMC;
    appData.lastResetDate = today;
    saveData(appData);
  }
}

/* ===== 导出模式：供 PowerShell 邮件脚本读取未完成任务 ===== */
function getUncompletedTasks() {
  var today = getTodayStr();
  var result = [];
  // 日常任务
  for(var i=0;i<appData.daily.length;i++){
    if(!appData.daily[i].completed){
      result.push({
        title: appData.daily[i].title,
        priority: appData.daily[i].priority,
        category: appData.daily[i].category,
        source: 'daily'
      });
    }
  }
  // 临时任务
  for(var i=0;i<appData.tempTasks.length;i++){
    if(!appData.tempTasks[i].completed){
      result.push({
        title: appData.tempTasks[i].title,
        priority: appData.tempTasks[i].priority,
        deadline: appData.tempTasks[i].tempDeadline || '',
        source: 'temp'
      });
    }
  }
  // 今日月度到期任务
  var now = new Date();
  var day = now.getDate();
  var month = now.getMonth()+1;
  for(var i=0;i<appData.midterm.length;i++){
    var item = appData.midterm[i];
    if(item.cycleDay === day){
      var isThisMonth = true;
      if(item.cycleMonths && item.cycleMonths.length){
        isThisMonth = item.cycleMonths.indexOf(month) >= 0;
      }
      if(isThisMonth){
        var key = today+'_'+item.id;
        if(!appData.monthlyCompleted[key]){
          result.push({
            title: item.title,
            priority: item.priority,
            cycleLabel: item.cycleLabel || '',
            source: 'monthly'
          });
        }
      }
    }
  }
  return result;
}

/* ===== 初始化 ===== */
function init() {
  checkDailyReset();
  var now = new Date();
  var weekDays = ['日','一','二','三','四','五','六'];
  document.getElementById('sidebar-date').textContent = now.getFullYear()+'年'+(now.getMonth()+1)+'月'+now.getDate()+'日 星期'+weekDays[now.getDay()];
  initCalendar();
  renderContent();
  updateClockUI();
  clockLoop();
  setInterval(clockLoop, 100); // 100ms刷新
  // 每分钟检查一次是否跨日（长时间不关页面时）
  setInterval(function(){
    var today = getTodayStr();
    if(appData.lastResetDate !== today){
      checkDailyReset();
      renderContent();
      renderCalendar();
    }
  }, 60000);
  // 云端同步初始化
  initCloudSync();
}

/* ===== 启动：导出模式 vs 正常模式 ===== */
var urlSearch = window.location.search;
if(urlSearch.indexOf('export=1') >= 0) {
  // 导出模式：输出未完成任务JSON
  checkDailyReset();
  var uncompleted = getUncompletedTasks();
  var exportData = { date: getTodayStr(), time: new Date().toLocaleString('zh-CN'), uncompleted: uncompleted, count: uncompleted.length };
  document.title = 'Export';
  document.body.innerHTML = '<pre id="export-data">'+JSON.stringify(exportData)+'</pre>';
  document.body.style.cssText = 'margin:0;padding:0;font-family:monospace;';
} else {
  init();
}
